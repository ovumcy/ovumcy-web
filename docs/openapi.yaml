openapi: 3.1.0

info:
  title: Ovumcy API
  version: 1.0.0
  summary: HTTP API surface of the ovumcy-web self-hosted deployment.
  description: |
    This document specifies the **current** state of the JSON-emitting HTTP
    surface of `ovumcy-web`. It is the authoritative description of what the
    server actually serves today.

    Stability — per [CONTRIBUTING.md](../CONTRIBUTING.md#api-stability-contract):

    - `/api/v1/*` is the canonical, stable HTTP surface. Wrappers and external
      integrations should target this prefix exclusively.
    - Field additions are non-breaking and may ship in any minor release.
    - Field renames, removals, status code changes, route moves, and error key
      changes are breaking and require a new major version (`/api/v2/*`).
    - The export payload (`/api/v1/exports/*`) follows the separate stability
      contract documented in [docs/export.md](export.md).

    Content negotiation — every endpoint serves both JSON and HTML/HTMX from the
    same handler. This document covers **only** the JSON contract. Clients must
    send `Accept: application/json` to opt into the JSON shape. Without that
    header the server returns HTML or `303` redirects suitable for browser
    navigation, and the corresponding response is not part of this contract.

    Methods — every operation served on `GET` is also served on `HEAD` by the
    same handler chain: same status, same headers, no body. Those mirrors are
    not published as separate operations; read the `GET` operation for what a
    `HEAD` request answers. `HEAD /api/v1/days/{date}` is the one `HEAD` with
    semantics of its own — it reports whether the day holds any data — and is
    documented per path below.

    Authentication & authorization — most endpoints require the sealed
    `ovumcy_auth` session cookie issued by `POST /api/v1/sessions`. Endpoints
    marked **owner only** additionally require the caller's `role` to be
    `owner`; non-owner roles receive `403`. State-changing endpoints also
    require a valid CSRF token. See [SECURITY.md](../SECURITY.md#cookies) for
    cookie attributes and [SECURITY.md#password--auth-policy](../SECURITY.md#password--auth-policy)
    for session semantics.

    Rate limits — the v1 auth endpoints (`/api/v1/sessions`, `/api/v1/users`,
    `/api/v1/password-resets`) carry per-IP HTTP rate limits with additional
    per-account budgets enforced by `AuthAttemptPolicy`. Specific defaults
    are listed in [SECURITY.md#rate-limits](../SECURITY.md#rate-limits).

    Errors — every error response from the endpoints below carries
    `{ "error": "<key>", "error_detail": { "key", "category", "target" } }`.
    The top-level `error` string is the
    legacy field kept for backward compatibility; `error_detail` is the
    structured form for programmatic clients (see `ApiError` /
    `ApiErrorDetail` in `components.schemas`). Clients should branch on the
    HTTP status code plus `error_detail.category` rather than the key string,
    and treat unknown keys/categories as their generic status-class failure.

    Page routes (`/login`, `/dashboard`, `/calendar`, etc.) are **not** part of
    this specification. They serve HTML to browsers only.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0
  contact:
    name: Ovumcy security
    url: https://github.com/ovumcy/ovumcy-web/blob/main/SECURITY.md
    email: contact@ovumcy.com

servers:
  - url: https://{deployment}
    description: Self-hosted Ovumcy instance.
    variables:
      deployment:
        default: ovumcy.example.com
        description: Hostname of your self-hosted Ovumcy deployment.

tags:
  - name: meta
    description: Liveness and language preference.
  - name: auth
    description: Session lifecycle — sign-up, sign-in, sign-out, 2FA, password reset.
  - name: onboarding
    description: First-run setup wizard.
  - name: days
    description: Daily health log entries (one per calendar day, in the user's timezone).
  - name: symptoms
    description: Owner-managed symptom catalog.
  - name: stats
    description: Aggregated cycle statistics.
  - name: export
    description: CSV / JSON / summary export. See docs/export.md.
  - name: settings
    description: Profile, account settings, and security controls.

security:
  - sessionCookie: []
    csrfToken: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ovumcy_auth
      description: |
        Sealed session cookie issued by `POST /api/v1/sessions` (or by completing
        the OIDC sign-in flow). Verified against `users.auth_session_version` on
        every request. See [SECURITY.md](../SECURITY.md#cookies).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit CSRF token validated against the `ovumcy_csrf` cookie.
        Browser clients usually submit it via the `csrf_token` form field
        instead of the header. Only pure-GET requests and the
        `/auth/oidc/callback` provider form-post path are exempt; every other
        state-changing request — including register, login, and password-reset
        — requires the token. Programmatic clients read it from the
        `ovumcy_csrf` cookie set on any GET (for example `GET /login`) and echo
        it in the `X-CSRF-Token` header or `csrf_token` form field. See
        [CSRF middleware configuration](../cmd/ovumcy/main.go).

  parameters:
    DateParam:
      name: date
      in: path
      required: true
      description: Calendar day in the user's timezone, ISO 8601 (`YYYY-MM-DD`).
      schema:
        type: string
        format: date
        example: "2026-05-17"
    FromQuery:
      name: from
      in: query
      required: false
      description: Range start (inclusive), `YYYY-MM-DD` in the user's timezone.
      schema:
        type: string
        format: date
    ToQuery:
      name: to
      in: query
      required: false
      description: Range end (inclusive), `YYYY-MM-DD` in the user's timezone.
      schema:
        type: string
        format: date
    SymptomId:
      name: id
      in: path
      required: true
      description: Symptom row identifier.
      schema:
        type: integer
        format: uint64
        minimum: 1

  responses:
    Unauthorized:
      description: Missing or invalid session cookie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "unauthorized"
            error_detail: { key: "unauthorized", category: "unauthorized", target: "global" }
    Forbidden:
      description: Session is valid but the caller lacks the required role (typically owner-only) or CSRF validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "forbidden"
            error_detail: { key: "forbidden", category: "forbidden", target: "global" }
    ValidationError:
      description: |
        Request body, path, or query parameters failed validation. The server
        answers `400` — it has no `422` branch, and a client that needs to tell a
        validation refusal apart from any other `400` reads
        `error_detail.category`, which is `validation` for every response using
        this component. `error_detail.target` follows the surface: `global` for
        programmatic endpoints, `auth_form` or `settings_form` where the
        rejection belongs inside a rendered form.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "invalid input"
            error_detail: { key: "invalid input", category: "validation", target: "global" }
    NotFound:
      description: The addressed resource does not exist for the authenticated account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "symptom not found"
            error_detail: { key: "symptom not found", category: "not_found", target: "settings_form" }
    Conflict:
      description: |
        The request collides with state the account already holds — a duplicate
        symptom name, or a cycle start that would overwrite an existing one. The
        envelope carries `error_detail.category: "conflict"`; the collision is
        resolvable by the client (rename, or resend with `replace_existing`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "symptom name already exists"
            error_detail: { key: "symptom name already exists", category: "conflict", target: "settings_form" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Whole seconds until the budget refills; `retry_after_seconds` echoes it.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "too many requests"
            error_detail: { key: "too many requests", category: "rate_limited", target: "global" }
            retry_after_seconds: 60
    ServiceUnavailable:
      description: |
        A dependency the operation needs is not available. On the step-up
        endpoints this is the identity provider: the account has no local
        password, so the re-authentication can only be satisfied through SSO,
        and SSO is disabled or unreachable. Retryable once the provider is back.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "sso temporarily unavailable"
            error_detail: { key: "sso temporarily unavailable", category: "internal", target: "auth_form" }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: "internal_error"
            error_detail: { key: "internal_error", category: "internal", target: "global" }

  schemas:
    ApiError:
      type: object
      description: |
        Standard error envelope. The top-level `error` string is the legacy
        key kept for backward compatibility. The `error_detail` object carries
        the structured form for programmatic clients — `category` identifies
        the error class (validation, unauthorized, rate_limited, …) and
        `target` distinguishes global errors from form-level ones. Clients
        should branch on the HTTP status code plus `error_detail.category`
        rather than the key string, and treat unknown keys/categories as their
        generic status-class failure.

        The envelope covers **every** rejection reachable from the surface this
        document describes, including the ones raised before or outside any
        operation below, so a client needs exactly one parse path. Those
        transport-level rejections are listed here rather than per-path — the
        request never reached an operation, so attaching them to one would
        misdescribe what happened — and each carries a stable key derived from
        the status alone:

          * `400` — `bad_request`
          * `401` — `unauthorized`
          * `403` — `forbidden` (this is the key a CSRF failure carries)
          * `404` — `not found`
          * `405` — `method_not_allowed`
          * `413` — `request_too_large` (body past the 16 MiB limit: wire size,
            and for a compressed body its decompressed size too)
          * `415` — `unsupported_media_type`
          * `429` — `too many requests`
          * `431` — `request_headers_too_large` (request head past the read
            buffer)
          * `500` — `internal_error`
          * `503` — `service_unavailable`

        One further `503` exists and carries its own key: a request that
        outlives the 60-second request budget is answered `request_timeout`,
        which says the request was abandoned rather than that the server is
        unwell, so a client may retry it.

        A status not in that list still answers with the envelope, keyed
        `request_rejected` for a `4xx` and `internal_error` for a `5xx`. The
        message a failing request produced internally is never echoed into the
        body.

        Three routes answer with a **fixed body** instead, and are named here
        so the rule above reads as exact rather than approximate — the same
        way the single CSRF validation exemption is named rather than left
        implied. `GET /healthz` and `GET /readyz` answer a fixed one-word JSON
        body in both outcomes, and the read-only calendar feed
        `GET /calendar/feed/{token}.ics` answers
        its not-found path with the fixed status-text body `Not Found`: one
        identical, cause-free `404` for a malformed token, an unknown selector,
        a wrong verifier and a disabled feed alike (see
        [docs/SECURITY_INVARIANTS.md](SECURITY_INVARIANTS.md) → *Calendar feed
        subscription*). The feed's per-IP `429` is not part of the exemption:
        its limiter refuses through the application's shared rate-limit path,
        as on every other route — the exemption covers the not-found answer,
        never a route wholesale. None of the three is part of this
        specification (`/healthz` and `/readyz` are documented below as a
        courtesy; the feed is a page route), and none is consumed by a client
        of this API — the probes are parsed by an operator's health check, the
        feed by a calendar application. The envelope negotiates its shape from
        the caller's `Accept`/`HX-Request` headers and carries localized copy,
        so putting it on the probes or on the feed's not-found path would let
        an anonymous caller choose the shape of those fixed answers; the
        feed's `404` must additionally stay identical whatever refused the
        token.
      required: [error, error_detail]
      properties:
        error:
          type: string
          example: "invalid credentials"
        error_detail:
          $ref: '#/components/schemas/ApiErrorDetail'
        retry_after_seconds:
          type: integer
          minimum: 1
          description: >-
            Present only on a `429`: an extension member echoing the
            `Retry-After` header, so it inherits that header's bound of whole
            seconds no larger than the configured window.
      additionalProperties: false

    ApiErrorDetail:
      type: object
      required: [key, category, target]
      properties:
        key:
          type: string
          description: Same value as the top-level `error` string. Duplicated here so a client that consumes only `error_detail` can branch without parsing the parent envelope.
          example: "invalid credentials"
        category:
          type: string
          enum: [validation, not_found, conflict, unauthorized, forbidden, rate_limited, too_large, internal]
          description: |
            Error class. Stable enum — new values may be added in any release
            but existing values do not change meaning, so treat an unknown
            category as the generic failure for its status class.

            `category` names the **reason**, not the status, so it is not a
            function of the status code. `413` is the case where that matters:
            a body past the 16 MiB limit — measured on the wire and, for a
            compressed request, on the decompressed stream — is refused before
            the request reaches any operation and carries `too_large` with the
            key `request_too_large`, while a restore payload that parses
            cleanly but declares more than 20 000 day entries has failed a
            content rule and carries `validation` with the key
            `import file too large`. Both are `413`; a client that branches on
            `413` alone cannot tell "send fewer bytes" from "split this export
            into several restores". `too_large` is likewise what a `431`
            carries when the request head does not fit the read buffer.
        target:
          type: string
          enum: [global, auth_form, settings_form]
          description: Where the error originated. `global` errors are unscoped; form targets indicate the error belongs inside an auth or settings form so HTMX-style clients can render it inline.
      additionalProperties: false

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      additionalProperties: false

    ImportResult:
      type: object
      required: [ok, added, skipped, rejected]
      properties:
        ok:
          type: boolean
          enum: [true]
        added:
          type: integer
          description: Days created that the account did not already have.
        skipped:
          type: integer
          description: Days that already existed and were left untouched (never overwritten).
        rejected:
          type: integer
          description: Malformed or duplicate day records dropped without writing.
      additionalProperties: false

    NextStepResponse:
      type: object
      description: |
        Answer of an auth step that succeeded but is not finished: the server
        sealed a one-time cookie and names where the client must go to spend it.
        `next_step` is the stable programmatic name of that stage; `next_path` is
        the page serving it. The enum is exactly the two stages reached this way
        (`POST /api/v1/users` and `POST /api/v1/password-resets/redeem`) — the
        calendar-feed reveal names a stage too and has its own schema, so a new
        stage extends the enum only if it also answers with this shape.
      required: [ok, next_step, next_path]
      properties:
        ok:
          type: boolean
          enum: [true]
        next_step:
          type: string
          enum: [register_welcome, recovery_code]
        next_path:
          type: string
          example: "/recovery-code"
      additionalProperties: false

    OkRedirectResponse:
      type: object
      required: [ok, redirect]
      properties:
        ok:
          type: boolean
          enum: [true]
        redirect:
          type: string
          description: Suggested next URL path for the client to follow.
          example: "/auth/oidc/logout"
      additionalProperties: false

    RegisterRequest:
      type: object
      required: [email, password, confirm_password, consent]
      properties:
        email:
          type: string
          format: email
          description: Account email. Normalized server-side (lowercased, trimmed).
        password:
          type: string
          format: password
          minLength: 8
          description: Must satisfy the password policy — 8+ Unicode code points, at most 72 bytes (bcrypt input limit), at least one uppercase letter, one lowercase letter, and one digit.
        confirm_password:
          type: string
          format: password
        consent:
          type: string
          description: Explicit consent to store health data, required for every registration. Truthy spellings, compared case-insensitively after trimming — `1`, `true`, `on`, `yes`. Any other value, and an absent field, are refused with 400 and `error_detail.key` `consent required`.
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false
          description: When true, the issued `ovumcy_auth` cookie carries an explicit ~7-day Expires. Otherwise the cookie is browser-session-scoped.
      additionalProperties: false

    RecoveryCodeRequiredResponse:
      type: object
      description: >-
        Step 1 of `POST /api/v1/password-resets`: the body named `email` alone,
        so nothing was started and the caller must repeat the request with
        `recovery_code` and `password`. Carries no `next_path` — the step is the
        same endpoint again, not another one.
      required: [ok, next_step]
      properties:
        ok:
          type: boolean
          enum: [true]
        next_step:
          type: string
          enum: [recovery_code]
      additionalProperties: false

    LoginTOTPRequiredResponse:
      type: object
      description: Returned when the password is correct and the account has TOTP 2FA enabled. The caller must follow up with `POST /api/v1/sessions/2fa-challenge`.
      required: [requires_totp]
      properties:
        requires_totp:
          type: boolean
          enum: [true]
      additionalProperties: false

    TOTPLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit code from the user's TOTP authenticator.
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      required: [email]
      description: >-
        Two-step body on one endpoint. Step 1 sends `email` alone; the
        response is `{"ok": true, "next_step": "recovery_code"}` and starts
        nothing. Step 2 repeats `email` and adds `recovery_code` and
        `password`, which is what actually calls `StartRecovery`. Neither
        step-2 field is schema-required, because an absent one does not fail
        validation, but the two are NOT read alike: `recovery_code` absent, or
        present and blank once trimmed, is what SELECTS step 1 — it is
        answered as `{"ok": true, "next_step": "recovery_code"}` like any
        other step-1 request, never refused. `password` has no such reading;
        once a non-blank `recovery_code` is present, an absent or blank
        `password` is refused later, by name, with the same uniform credential
        rejection a wrong value gets. See each field's own description.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: >-
            The account's CURRENT password, required alongside the recovery
            code. The recovery code substitutes for the second factor (TOTP),
            never for the password, so this endpoint verifies two secrets. A
            wrong or empty password is refused exactly as a wrong recovery
            code is — same status, same body — and consumes the same attempt
            budget. A JSON body that omits the member entirely is the shape
            this endpoint accepted before v2.0.0, so it is refused by name
            (`recovery reset requires the account password`, 400) before any
            account is read: it names no credential and reveals nothing.
            Form encoding cannot express the
            difference between an omitted and an empty field, so a form
            submission keeps the uniform credential refusal. The route's own
            per-IP budget applies to it as to any other request here; what it
            skips is the per-address attempt bucket, which only a submitted
            credential can spend. An owner who has
            forgotten the password cannot recover here and needs the operator
            CLI `ovumcy reset-password <email>`.
        recovery_code:
          type: string
          pattern: '^OVUM-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$|^\s*$'
          description: >-
            Single-use recovery code minted at registration or by `POST
            /api/v1/users/current/recovery-code`. Omitted, or sent blank —
            empty or all whitespace, matching the server's own
            `strings.TrimSpace(...) == ""` test — selects step 1 (see this
            schema's own description) and is never refused on that account;
            the pattern's `|^\s*$` alternative exists for that value alone,
            not to widen what a real code may look like. Once non-blank, the
            pattern documents the server's
            accepted request shape (`ValidateRecoveryCodeFormat` in
            `internal/services/auth_input_policy.go`), which is deliberately
            wider than the alphabet `GenerateRecoveryCode`
            (`internal/services/auth_reset_policy.go`) actually emits —
            Crockford-style base32 excluding `I`/`O`/`0`/`1` to avoid
            visually-ambiguous characters. Narrowing this pattern to the
            generator's exact alphabet would reintroduce the same defect this
            fixes in milder form: a spec-following client would reject some
            fraction of codes the server would otherwise accept.
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      required: [password, confirm_password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: Must satisfy the same password policy as registration — 8+ Unicode code points, at most 72 bytes (bcrypt input limit), with uppercase, lowercase, and a digit.
        confirm_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false

    DayPayload:
      type: object
      description: |
        Day entry payload. A JSON body replaces the whole record with exactly
        what it states: every field it sends is read, and an omitted field is
        written as its default. Read is not the same as validated — a
        temperature outside the accepted range is refused with 400, an unknown
        spelling of sex_activity, cervical_mucus or pregnancy_test collapses to
        "none", and notes are trimmed. Hidden-field preservation belongs to the
        form body the browser day editor posts, not here — for a field the
        account hides in its tracking preferences (BBT, cervical mucus, sex
        activity, cycle factors, notes) that form carries no input, the request
        is not read for one, and an update keeps what is already stored under
        the same rules a sent value gets: a stored temperature outside the
        accepted range is no reading and comes back empty. A new day starts the
        field empty.
      properties:
        is_period:
          type: boolean
          default: false
        flow:
          type: string
          enum: [none, spotting, light, medium, heavy]
          default: none
        mood:
          type: integer
          description: Mood scale value. Zero means unset.
        sex_activity:
          type: string
          enum: [none, protected, unprotected]
          default: none
        bbt:
          type: [number, "null"]
          format: float
          description: >-
            Basal body temperature in the unit selected per account (°C or °F).
            Omitted or null means not measured. On write, a null, an omitted
            field, or a non-positive value (legacy 0 sentinel) is stored as
            "not measured"; the non-positive test is applied to the value as
            sent, in the account's unit, so a positive value outside the
            physiological range is refused with 400 rather than emptied (a form
            save from an account that hides temperature does not read the field
            at all).
        cervical_mucus:
          type: string
          enum: [none, dry, moist, creamy, eggwhite]
          default: none
        pregnancy_test:
          type: string
          enum: [none, negative, positive]
          default: none
        cycle_factor_keys:
          type: array
          items: { type: string }
          description: Free-form factor identifiers recorded that day (`stress`, `travel`, `illness`, ...).
        symptom_ids:
          type: array
          items:
            type: integer
            format: uint64
            minimum: 1
          description: References to symptom_types rows owned by the user.
        notes:
          type: string
      additionalProperties: false

    DailyLog:
      type: object
      description: |
        A persisted day record. `date` is stored as UTC midnight on disk and
        rendered in the caller's timezone at read time.
      required: [id, user_id, date, is_period, flow, mood, sex_activity, cervical_mucus, pregnancy_test]
      properties:
        id:
          type: integer
          format: uint64
        user_id:
          type: integer
          format: uint64
        date:
          type: string
          format: date
        is_period: { type: boolean }
        cycle_start: { type: boolean }
        is_uncertain: { type: boolean }
        flow:
          type: string
          enum: [none, spotting, light, medium, heavy]
        mood: { type: integer }
        sex_activity:
          type: string
          enum: [none, protected, unprotected]
        bbt:
          type: [number, "null"]
          format: float
          description: >-
            Always Celsius regardless of the account's display unit
            preference (write-side unit conversion happens on input; storage
            and this response are canonical Celsius). Present only when
            measured; absent when not measured.
        cervical_mucus:
          type: string
          enum: [none, dry, moist, creamy, eggwhite]
        pregnancy_test:
          type: string
          enum: [none, negative, positive]
        cycle_factor_keys:
          type: array
          items: { type: string }
        symptom_ids:
          type: array
          items:
            type: integer
            format: uint64
        notes: { type: string }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SymptomPayload:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          description: >-
            User-visible symptom label. The server caps it at 40 **runes**
            (Unicode code points), not bytes, and measures the value after
            collapsing internal whitespace runs and trimming
            (`normalizeSymptomNameInput` in
            `internal/services/symptom_name_policy.go`), so a name whose
            normalized form fits is accepted even when the raw string is
            longer. Markup (`<`, `>`) and control characters are rejected,
            not stripped.
        icon:
          type: string
          maxLength: 16
          description: >-
            Single emoji or short symbol shown next to the name in the UI.
            Capped at 16 **runes** after trimming
            (`normalizeSymptomIconInput`) — wide enough for a multi-codepoint
            emoji sequence. Omitted or blank falls back to the default icon.
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Hex color for the symptom chip background.
      additionalProperties: false

    Symptom:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: uint64
        user_id:
          type: integer
          format: uint64
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        is_builtin: { type: boolean }
        archived_at:
          type: [string, "null"]
          format: date-time

    StatsOverview:
      type: object
      description: |
        Aggregate cycle statistics for the current owner.

        Recorded history — the observed cycle lengths, the last period start,
        the current cycle day — is published in every state. Every PROJECTED
        date is `null` while the projection it belongs to is suppressed: read
        `suppression` for whether and why. The instance withholds a claim it
        cannot stand behind rather than qualifying it, so an absent date is a
        decision, never a gap in the data.
      required:
        - current_cycle_day
        - current_phase
        - current_fertility
        - average_cycle_length
        - median_cycle_length
        - min_cycle_length
        - max_cycle_length
        - cycle_length_std_dev
        - completed_cycle_count
        - average_period_length
        - last_cycle_length
        - last_period_length
        - luteal_phase
        - last_period_start
        - next_period_start
        - ovulation_date
        - ovulation_exact
        - ovulation_confirmed
        - ovulation_impossible
        - fertility_window_start
        - fertility_window_end
        - pregnancy_paused
        - suppression
        - disclaimer
        - disclaimer_key
      properties:
        current_cycle_day:
          type: integer
          description: Day of the running cycle, 1-based. `0` before any cycle anchor exists.
        current_phase:
          type: string
          enum: [menstrual, follicular, ovulation, luteal, unknown]
          description: >-
            Phase taxonomy. "Fertile" is a status, never a phase — see
            `current_fertility`. The phase is the axis orthogonal to fertility
            and is reported in every state, including one where the projected
            dates are withheld — so a phase may be named beside a null
            `ovulation_date`. Read `suppression` for why the date is absent.
        current_fertility:
          type: string
          enum: [fertile, not_fertile, unknown]
          description: >-
            Whether today falls inside the predicted fertile window — the axis
            orthogonal to `current_phase`. `unknown` whenever
            `suppression.fertility` is true.
        average_cycle_length:
          type: number
          format: double
        median_cycle_length:
          type: integer
        min_cycle_length:
          type: integer
        max_cycle_length:
          type: integer
        cycle_length_std_dev:
          type: number
          format: double
        completed_cycle_count:
          type: integer
          description: >-
            Completed cycles observed. Zero is the first-cycle floor: the
            fertility half of the projection has nothing but the onboarding
            cycle-length setting behind it and is suppressed.
        average_period_length:
          type: number
          format: double
        last_cycle_length:
          type: integer
        last_period_length:
          type: integer
        luteal_phase:
          type: integer
          description: Days following ovulation; per-owner when inferable, else the 14-day default.
        last_period_start:
          type: [string, "null"]
          format: date
          description: Recorded anchor, not a projection. Null only when no cycle start is known.
        next_period_start:
          type: [string, "null"]
          format: date
          description: Projected. Null when `suppression.predictions` is true.
        ovulation_date:
          type: [string, "null"]
          format: date
          description: >-
            Projected, unless the owner's own BBT readings have already
            confirmed the current cycle's ovulation, in which case this is the
            measured day the calendar and dashboard also show. Null when
            `suppression.fertility` is true.
        ovulation_exact:
          type: boolean
          description: >-
            The ovulation date is anchored on a per-owner inferred luteal
            phase rather than on the 14-day fallback. Independent of
            `ovulation_confirmed` — a fallback-luteal cycle (`false` here) can
            still have its ovulation confirmed by a BBT shift. Always false
            when `ovulation_date` is null.
        ovulation_confirmed:
          type: boolean
          description: >-
            `ovulation_date` is a MEASUREMENT: the owner's own BBT readings
            already confirmed the current cycle's ovulation, and the date
            reported is the detector's day rather than the model's
            projection — the same day the calendar's solid marker and the
            dashboard's ovulation line show. Always false when
            `ovulation_date` is null.
        ovulation_impossible:
          type: boolean
          description: >-
            No ovulation can be placed in the running cycle at all. Always
            `false` when `suppression.fertility` is true — the underlying
            claim is itself derived from the fertility projection, so it is
            withheld along with `ovulation_date` and the fertile window
            rather than surviving beside a suppressed one.
        fertility_window_start:
          type: [string, "null"]
          format: date
          description: Projected. Null when `suppression.fertility` is true.
        fertility_window_end:
          type: [string, "null"]
          format: date
          description: Projected. Null when `suppression.fertility` is true.
        pregnancy_paused:
          type: boolean
          description: >-
            A positive pregnancy test with no later cycle start. One of the
            signals behind `suppression`.
        suppression:
          $ref: '#/components/schemas/StatsOverviewSuppression'
        disclaimer:
          type: string
          description: >-
            The medical-safety disclaimer in the owner's interface language.
            Render it wherever any of these values is shown.
        disclaimer_key:
          type: string
          description: >-
            Stable catalogue key of `disclaimer` (`medical.disclaimer`), so a
            client can branch on it without parsing translated prose.
      additionalProperties: false

    StatsOverviewSuppression:
      type: object
      description: |
        Why the payload withholds a projection. `predictions` covers every
        projected date; `fertility` covers the fertility half only (ovulation
        date and fertile window) and is true whenever `predictions` is.
      required: [predictions, fertility, reasons]
      properties:
        predictions:
          type: boolean
        fertility:
          type: boolean
        reasons:
          type: array
          description: >-
            Signals that hold right now — possibly several at once, possibly
            none. Never null.
          items:
            type: string
            enum:
              - unpredictable_cycle
              - pregnancy_pause
              - cycle_overdue
              - awaiting_first_cycle
      additionalProperties: false

    ExportJSONEntry:
      type: object
      description: One day in a JSON export. See [docs/export.md](export.md) for the per-field stability contract.
      required:
        - date
        - period
        - flow
        - mood_rating
        - sex_activity
        - bbt
        - cervical_mucus
        - cycle_factors
        - symptoms
        - other_symptoms
        - notes
      properties:
        date:
          type: string
          format: date
        period: { type: boolean }
        cycle_start: { type: boolean }
        is_uncertain: { type: boolean }
        flow:
          type: string
          enum: [none, spotting, light, medium, heavy]
        mood_rating: { type: integer }
        sex_activity:
          type: string
          enum: [none, protected, unprotected]
        bbt:
          type: [number, "null"]
          format: float
          description: >-
            Emitted only when measured; absent otherwise. Always Celsius,
            whatever unit the account displays. On import, absent, null, or a
            non-positive value (legacy 0 sentinel) all mean "not measured". A
            value outside the accepted range is read as "not measured" like any
            other malformed field, not rejected — an import restores the file
            around it instead of refusing the day, which is the opposite of what
            a day write does with the same value.
        cervical_mucus:
          type: string
          enum: [none, dry, moist, creamy, eggwhite]
        pregnancy_test:
          type: string
          enum: [none, negative, positive]
        cycle_factors:
          type: array
          items: { type: string }
        symptoms:
          $ref: '#/components/schemas/ExportSymptomFlags'
        other_symptoms:
          type: array
          items: { type: string }
        notes: { type: string }

    ExportSymptomFlags:
      type: object
      description: 16 fixed boolean flags for built-in symptoms. Always present with all keys, even when all values are false.
      required:
        - cramps
        - headache
        - acne
        - mood
        - bloating
        - fatigue
        - breast_tenderness
        - back_pain
        - nausea
        - spotting
        - irritability
        - insomnia
        - food_cravings
        - diarrhea
        - constipation
        - swelling
      properties:
        cramps: { type: boolean }
        headache: { type: boolean }
        acne: { type: boolean }
        mood: { type: boolean }
        bloating: { type: boolean }
        fatigue: { type: boolean }
        breast_tenderness: { type: boolean }
        back_pain: { type: boolean }
        nausea: { type: boolean }
        spotting: { type: boolean }
        irritability: { type: boolean }
        insomnia: { type: boolean }
        food_cravings: { type: boolean }
        diarrhea: { type: boolean }
        constipation: { type: boolean }
        swelling: { type: boolean }
      additionalProperties: false

    ExportJSON:
      type: object
      required: [exported_at, entries]
      properties:
        exported_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ExportJSONEntry'
      additionalProperties: false

    ExportSummary:
      type: object
      required: [total_entries, has_data]
      properties:
        total_entries: { type: integer }
        has_data: { type: boolean }
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date

    CycleSettings:
      type: object
      description: |
        A partial update, as the verb says: a member this body does not carry
        keeps the value the account already holds, and only what is actually
        sent can change. A member carrying a zero value (`false`, `""`) is
        present and is written — absence and a zero value are different answers.
        Until v2.0.0 an absent member was read as its zero value, so a save of
        the two lengths alone rewrote `usage_goal` to `health` and `age_group`
        to unknown.

        A body that names none of these members is refused with `400
        invalid settings input` rather than answered `200`: it asks for no
        change, and a save that changed nothing must not be recorded as one.

        The bundled settings form is not affected and is not described by this
        schema: it submits every control it owns on every save, and an unchecked
        box submits nothing at all, so a form body carries no absence to honour
        and is read as the full snapshot it is.
      properties:
        cycle_length:
          type: integer
          minimum: 15
          maximum: 90
          description: >-
            Rejected with a validation error outside 15–90
            (`ValidateCycleSettings` in
            `internal/services/settings_cycle_policy.go`) — unlike the
            identically-named field on `OnboardingStep2Request`, which is
            clamped into range instead.
        period_length:
          type: integer
          minimum: 1
          maximum: 14
          description: >-
            Rejected with a validation error outside 1–14. A cross-field rule
            the numeric bounds cannot express applies on top: the server also
            requires `period_length` to be at most `cycle_length` minus 10
            (still capped at 14), so a payload valid against both bounds on
            its own — say `cycle_length: 15`, `period_length: 14` — is still
            refused.
        auto_period_fill: { type: boolean }
        irregular_cycle: { type: boolean }
        unpredictable_cycle: { type: boolean }
        age_group:
          type: string
          enum: ["", under_40, age_40_45, age_45_plus]
        usage_goal:
          type: string
          enum: [health, avoid_pregnancy, trying_to_conceive]
          description: >-
            A body carrying `usage_goal` and no other member at all is the
            dashboard quick switch: it writes that one column directly. Any
            other body takes the ordinary partial path above, which reaches the
            same result for the members it carries. The goal is only ever
            changed by an explicit owner action — nothing logged on a day,
            including a positive pregnancy test, rewrites it.
        last_period_start:
          type: string
          format: date

    ReminderSettings:
      type: object
      properties:
        reminder_lead_days:
          type: integer
          minimum: 0
          maximum: 14
          description: >-
            Days ahead the dashboard period/ovulation reminder appears. Values
            outside 0–14 are clamped, not rejected.

    CurrentUser:
      type: object
      required: [id, email, role, onboarding_completed, local_auth_enabled, must_change_password]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner] }
        onboarding_completed: { type: boolean }
        local_auth_enabled: { type: boolean }
        must_change_password: { type: boolean }
      additionalProperties: false

    ProfileSettings:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
          description: >-
            Capped at 64 **runes** (Unicode code points), not bytes, and
            measured after trimming surrounding whitespace
            (`NormalizeDisplayName` in
            `internal/services/settings_profile_policy.go`), so a padded value
            whose trimmed form fits is accepted. Markup (`<`, `>`) and control
            characters are rejected, not stripped. An empty value clears the
            display name.

    InterfaceSettings:
      type: object
      description: |
        Interface preferences save. `language` is stored twice: in the
        `ovumcy_lang` cookie the response sets, and on the account
        (`users.interface_language`), which is what re-issues that cookie on a
        device signing in for the first time. `theme` has no server-side
        storage — it stays in the browser's `localStorage`.
      properties:
        language:
          type: string
          enum: [en, ru, es, fr, de, it]
        theme:
          type: string

    TrackingSettings:
      type: object
      description: |
        JSON body of the tracking-preferences save. The three section
        visibility flags keep their stored, inverted spelling here
        (`hide_sex_chip`, `hide_cycle_factors`, `hide_notes_field`): renaming a
        v1 field is a breaking change, so the published contract is unchanged.
        The bundled settings form posts the positive `show_sex_chip`,
        `show_cycle_factors` and `show_notes_field` fields instead — the
        toggles read "show" in the interface — and the server converts the two
        vocabularies in a single place. Every field is a full snapshot: an
        omitted flag reads as `false`, it is not a no-op.
      properties:
        track_bbt: { type: boolean }
        temperature_unit:
          type: string
          enum: [c, f]
        track_cervical_mucus: { type: boolean }
        hide_sex_chip: { type: boolean }
        hide_cycle_factors: { type: boolean }
        hide_notes_field: { type: boolean }
        show_historical_phases: { type: boolean }

    TimezoneSettings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone name (e.g. `Europe/Berlin`). Validated server-side; "Local" and non-IANA values are rejected.

    WebhookSettings:
      type: object
      description: |
        Webhook notification settings save (issue #124). The endpoint URL is a
        secret and is treated like a password field: `webhook_url` is
        `writeOnly` — it is accepted here, encrypted at rest, and never returned
        by any response. Omit or blank `webhook_url` to keep the stored endpoint;
        set `webhook_remove_url: true` to clear it. `reminder_lead_days` is NOT
        edited by this endpoint (it is a separate control) and is preserved.
      properties:
        webhook_enabled:
          type: boolean
          description: Master switch for outbound webhook reminders. Requires a stored or supplied URL to enable delivery.
        webhook_url:
          type: string
          format: uri
          writeOnly: true
          description: |
            Write-only http/https endpoint. May embed a notification token, so
            it is encrypted at rest and never echoed back. Blank means "leave the
            stored endpoint unchanged".
        webhook_notify_period:
          type: boolean
          description: Send a reminder when a period is predicted soon.
        webhook_notify_ovulation:
          type: boolean
          description: Send a reminder when ovulation is predicted soon.
        webhook_remove_url:
          type: boolean
          description: When true, clears the stored endpoint and forces delivery off. Takes precedence over webhook_url.
      additionalProperties: false

    CalendarFeedRevealResponse:
      type: object
      description: |
        JSON response for a calendar-feed generate/rotate. The subscribe URL
        embeds a bearer capability token, so it is a **write-only secret** and is
        NEVER carried in this body (nor in any query string, redirect target, or
        log): it is sealed into a one-time cookie and revealed exactly once on the
        `next_path` page. A JSON client receives only the outcome status and the
        path to that one-time reveal — never the URL or token itself. See the
        *Calendar feed subscription (.ics)* section of
        [SECURITY.md](../SECURITY.md#calendar-feed-subscription-ics).
      required: [ok, status, next_step, next_path]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          description: Outcome key — `calendar_feed_generated` on first enable, `calendar_feed_rotated` on a rotate.
          enum: [calendar_feed_generated, calendar_feed_rotated]
        next_step:
          type: string
          description: Opaque next-step key for the one-time subscribe-URL reveal.
          enum: [calendar_feed_reveal]
        next_path:
          type: string
          description: |
            Path to the dedicated one-time reveal page that shows the subscribe
            URL exactly once. Carries no secret itself.
          example: "/settings/calendar-feed"
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: Must satisfy the same password policy as registration — 8+ Unicode code points, at most 72 bytes (bcrypt input limit), with uppercase, lowercase, and a digit.
        confirm_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false

    StartLocalPasswordSetupRequest:
      type: object
      required: [new_password, confirm_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          description: Must satisfy the same password policy as registration — 8+ Unicode code points, at most 72 bytes (bcrypt input limit), with uppercase, lowercase, and a digit.
        confirm_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false

    StartLocalPasswordSetupResponse:
      type: object
      required: [ok, redirect_url]
      properties:
        ok:
          type: boolean
          enum: [true]
        redirect_url:
          type: string
          description: Provider authorize URL the browser must follow to begin re-auth.

    PasswordOnlyRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password

    TOTPEnrollmentRequest:
      allOf:
        - $ref: '#/components/schemas/PasswordOnlyRequest'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: "^[0-9]{6}$"
              description: 6-digit code generated by the authenticator app against the secret displayed on the setup page.

    OnboardingStep1Request:
      type: object
      description: First-step onboarding payload — owner specifies first day of latest period.
      required: [last_period_start]
      properties:
        last_period_start:
          type: string
          format: date

    OnboardingStep2Request:
      type: object
      required: [cycle_length, period_length]
      properties:
        cycle_length:
          type: integer
          minimum: 15
          maximum: 90
        period_length:
          type: integer
          minimum: 1
          maximum: 14
        auto_period_fill: { type: boolean }
        irregular_cycle: { type: boolean }
        usage_goal:
          type: string
          enum: [health, avoid_pregnancy, trying_to_conceive]
          description: >-
            Absent or unknown resolves to `health`, which is what the step's
            visible skip action submits. Onboarding does not collect the age
            bracket; `age_group` is written by
            `PATCH /api/v1/users/current/cycle` only. A body that still names
            `age_group` — the shape this step accepted before v2.0.0 — is
            refused with `onboarding does not accept an age group` (400) on
            both transports, rather than saved minus the field it submitted.

paths:
  # =========================================================================
  # meta
  # =========================================================================
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe.
      description: >-
        Returns 200 OK when the application is running. It never touches the database,
        so it stays green while storage is unreachable — use `/readyz` for that.
        Public, no session required.
      security: []
      responses:
        '200':
          description: Service is alive.

  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe.
      description: >-
        Returns 200 OK when the application can serve traffic, and 503 when the storage
        layer does not answer a trivial probe. Both responses carry a fixed, non-revealing
        body; no driver, path, or error detail is exposed. Public, no session required.
        The container health check deliberately stays on `/healthz` so a transient storage
        failure cannot restart the container.
      security: []
      responses:
        '200':
          description: Service is ready.
        '503':
          description: Service is not ready.

  /lang:
    post:
      tags: [meta]
      summary: Set UI language preference.
      description: |
        Writes the `ovumcy_lang` cookie for the chosen language. Public, no session required.
        When the request does carry a valid session, the language is also stored on the account
        (`users.interface_language`, the same column `PATCH /api/v1/users/current/interface`
        writes), so a later session issue re-serves the switched language instead of reverting
        the cookie to the stored one. The response is the same either way.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [lang, csrf_token]
              properties:
                lang:
                  type: string
                  enum: [en, ru, es, fr, de, it]
                  description: Form field name is `lang` (the handler reads `c.FormValue("lang")`) — distinct from the `language` JSON field on `PATCH /api/v1/users/current/interface`.
                csrf_token: { type: string }
      responses:
        '200':
          description: HTMX-style success.
        '303':
          description: Redirect to referer or `/`.

  # =========================================================================
  # auth
  # =========================================================================
  /api/v1/users:
    post:
      tags: [auth]
      summary: Create a new owner account.
      description: |
        Returns the same response shape (a single sealed `ovumcy_register_pickup`
        cookie of fixed length, redirect to `/register/welcome`) for new and
        duplicate emails. See [SECURITY.md "Register enumeration"](../SECURITY.md#register-enumeration-pickup-cookie-follow-up-oracle-residual).
        Per-IP rate limit: default 8 / 15 min.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: |
            Pickup cookie issued. Sent when `Accept: application/json` is set; the
            browser surface gets the `303` below instead. Identical for new and
            duplicate emails.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextStepResponse' }
              example:
                ok: true
                next_step: "register_welcome"
                next_path: "/register/welcome"
        '303':
          description: Redirect to `/register/welcome` with the sealed pickup cookie. Shape is identical for new and duplicate emails.
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Registration is closed on this deployment (SSO-only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "local sign-in unavailable"
                error_detail: { key: "local sign-in unavailable", category: "forbidden", target: "auth_form" }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/sessions:
    post:
      tags: [auth]
      summary: Sign in with email and password.
      description: |
        Per-IP rate limit (default 8 / 15 min) plus per-account
        `AuthAttemptPolicy` budget. Constant-time password verification with
        equalized bcrypt timing on the missing-user branch.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            Either signed in (issues `ovumcy_auth`) or 2FA challenge required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - $ref: '#/components/schemas/LoginTOTPRequiredResponse'
              examples:
                signedIn:
                  summary: Signed in
                  value: { ok: true }
                totpRequired:
                  summary: 2FA challenge required
                  value: { requires_totp: true }
        '303':
          description: "When `Accept: application/json` is not set, redirect to `/dashboard`, `/auth/2fa`, or `/reset-password`."
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "invalid credentials"
                error_detail: { key: "invalid credentials", category: "unauthorized", target: "auth_form" }
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Local sign-in is disabled on this deployment (SSO-only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "local sign-in unavailable"
                error_detail: { key: "local sign-in unavailable", category: "forbidden", target: "auth_form" }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/sessions/2fa-challenge:
    post:
      tags: [auth]
      summary: Submit the TOTP code in the 2FA challenge.
      description: |
        Requires the `ovumcy_totp_pending` cookie issued by a successful
        password login. Per-account TOTP rate limit: 5 attempts / 15 min.
        Replayed codes within the 30-second step are rejected with the same
        response shape as an invalid code.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPLoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TOTPLoginRequest' }
      responses:
        '200':
          description: 2FA verified; `ovumcy_auth` issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '303':
          description: Browser redirect to `/`.
        '401':
          description: Invalid code or pending session expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/sessions/current:
    delete:
      tags: [auth]
      summary: Revoke current session.
      description: |
        Bumps `auth_session_version` (invalidating every other auth cookie for
        the account), clears auth-related cookies, and may return an OIDC
        end-session bridge URL if the session was OIDC-backed.
        Per-account rate limit: 60 / 15 min.
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - $ref: '#/components/schemas/OkRedirectResponse'
        '303':
          description: Browser redirect to `/login` or the OIDC logout bridge path.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/password-resets:
    post:
      tags: [auth]
      summary: Begin password reset with the password and the recovery code.
      description: |
        Validates the `(email, recovery_code, password)` triple without leaking
        which part was wrong. The recovery code stands in for the second factor
        only — the account password is required too — and every rejection
        (unknown address, local auth disabled, wrong code, wrong or empty
        password) answers identically. A JSON body carrying no `password`
        member is answered before that check, by name — see the field's own
        description. Per-IP rate limit: default 8 / 1 hour.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: |
            Sent when `Accept: application/json` is set; the browser surface gets
            the `303` below instead. Two shapes, one per step of the flow — see
            `ForgotPasswordRequest`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecoveryCodeRequiredResponse'
                  - $ref: '#/components/schemas/OkResponse'
              examples:
                recoveryCodeRequired:
                  summary: Step 1 — email alone; nothing started yet
                  value: { ok: true, next_step: "recovery_code" }
                resetCookieIssued:
                  summary: Step 2 — reset cookie issued
                  value: { ok: true }
        '303':
          description: Redirect to `/reset-password` with a sealed reset cookie.
        '400':
          description: >-
            Every step-2 rejection lands here with the same uniform body,
            whichever of email/recovery_code/password was wrong or missing —
            `mapPasswordRecoveryStartError` in `internal/api/error_mapping_auth.go`
            has no arm that answers with 401: this endpoint proves nothing to
            an unauthenticated caller by status code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Local password recovery is disabled on this deployment (SSO-only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "local recovery unavailable"
                error_detail: { key: "local recovery unavailable", category: "forbidden", target: "auth_form" }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/password-resets/redeem:
    post:
      tags: [auth]
      summary: Set a new password using the reset cookie.
      description: |
        Requires the `ovumcy_reset_password` cookie issued by `POST
        /api/v1/password-resets`. Bumps `auth_session_version` on success.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: |
            Password replaced and a session issued; the freshly minted recovery
            code waits behind `next_path`. Sent when `Accept: application/json`
            is set; the browser surface gets the `303` below instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextStepResponse' }
              example:
                ok: true
                next_step: "recovery_code"
                next_path: "/recovery-code"
        '303':
          description: Redirect to `/login` after success.
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: |
            Local password recovery is disabled on this deployment (SSO-only).
            Only a reset token minted by the OIDC sign-in flow for an account
            carrying `must_change_password` survives this gate and can still be
            redeemed. A token minted by a LOCAL password — the plain sign-in
            form, or the OIDC account-link confirmation step's own password
            challenge — is refused here exactly like an ordinary
            password-recovery token, since it was produced by the very factor
            this deployment has disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "local recovery unavailable"
                error_detail: { key: "local recovery unavailable", category: "forbidden", target: "auth_form" }
        '429': { $ref: '#/components/responses/RateLimited' }

