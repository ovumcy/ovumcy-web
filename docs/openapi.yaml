  # =========================================================================
  # days
  # =========================================================================
  /api/v1/days:
    get:
      tags: [days]
      summary: List daily log entries in a date range.
      description: |
        Both bounds are required and inclusive: `from` equal to `to` lists that one day. Each
        bound is read on the request's timezone, and surrounding whitespace is trimmed before
        it is parsed. Each bound is a date from `1900-01-01` through `9999-12-30`.
      parameters:
        - in: query
          name: from
          required: true
          description: Range start (inclusive), `YYYY-MM-DD` in the request's timezone.
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          description: Range end (inclusive), `YYYY-MM-DD` in the request's timezone. Not before `from`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Array of day entries. Empty array when no rows match the range.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: |
            The range is refused before any row is read, with one of three keys. `from` is checked
            first, then `to`, then their order, so a request with both bounds wrong names only
            `from`:

            - `invalid from date`: `from` is missing, blank (whitespace only), not a `YYYY-MM-DD`
              date, not a real calendar date, outside `1900-01-01` through `9999-12-30`, or a day
              the request's timezone never had.
            - `invalid to date`: the same for `to`, once `from` parsed.
            - `invalid range`: both parse but `to` is before `from`.

            A missing bound gets the same key as a malformed one; there is no separate
            "required" key. Every caller except an HTMX request gets the JSON envelope below. An
            HTMX request (`HX-Request: true`) gets the localized status fragment as `text/html`
            instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                invalidFrom:
                  summary: "`from` missing or not a date"
                  value:
                    error: "invalid from date"
                    error_detail: { key: "invalid from date", category: "validation", target: "global" }
                invalidTo:
                  summary: "`to` missing or not a date"
                  value:
                    error: "invalid to date"
                    error_detail: { key: "invalid to date", category: "validation", target: "global" }
                invalidRange:
                  summary: "`to` before `from`"
                  value:
                    error: "invalid range"
                    error_detail: { key: "invalid range", category: "validation", target: "global" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/days/{date}:
    parameters:
      - $ref: '#/components/parameters/DateParam'
    get:
      tags: [days]
      summary: Read a single day's entry (owner only).
      description: |
        For a date the request accepts, the status does not depend on whether
        the day has a stored record: a day with no record is answered `200`
        with a placeholder built at
        read time and never stored: `id` is `0`, `user_id` is the caller,
        `date` is the requested date, `is_period`, `cycle_start` and
        `is_uncertain` are `false`, `flow`, `sex_activity`, `cervical_mucus`
        and `pregnancy_test` are `none`, `mood` is `0`, `notes` is empty,
        `cycle_factor_keys` and `symptom_ids` are `[]`, `bbt` is absent, and
        `created_at` and `updated_at` are `0001-01-01T00:00:00Z`.
        `id: 0` means "no stored record"; a stored record always has a
        non-zero `id`. A stored record can still hold no data (a `PUT` that
        sends no values creates one), so ask `HEAD` whether the day holds data.
      responses:
        '200':
          description: 'The stored day record, or the `id: 0` placeholder when the day has none.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    head:
      tags: [days]
      summary: Check whether the day holds any entered data (owner only).
      description: |
        Answers, without a body, whether the day holds data: `200` when a
        stored record for the day carries at least one entered value — period,
        a flow other than `none`, mood 1–5, intimacy, BBT, cervical mucus, a
        pregnancy test, a cycle factor, a symptom, or non-blank notes — and
        `404` otherwise, including when a record exists but carries none of
        them. Here `404` is an answer, not an error. Clients branch on the
        status code.
      responses:
        '200':
          description: The day holds data.
        '404':
          description: The day holds no data, whether or not a record is stored.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [days]
      summary: Upsert a day's entry (owner only).
      description: |
        Creates a new row when missing or updates the existing row. The JSON body
        below carries every field it sends: an omitted field is cleared, and an
        impossible value is refused rather than stored as "not measured".
        Hidden-field preservation is a property of the form body the browser day
        editor posts, which this operation does not describe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayPayload' }
      responses:
        '200':
          description: Persisted entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The caller is not the owner, or the request was refused before the handler runs
            (CSRF) with the shared `forbidden` key.

            A caller that asks for JSON gets the JSON envelope. A browser form submitted without
            JavaScript — a `POST` carrying the hidden `_method=PUT` field, with an `Accept` that
            names `text/html` — gets the shared localized status fragment as `text/html` instead.
            For the browser that fragment is the whole page, so it ends with a link back to the
            calendar day when the form's `source` query parameter is `calendar`, and to
            `/dashboard` otherwise. The link is fixed by the route; nothing else the request
            carries reaches it, and no cookie, flash included, is set.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "forbidden"
                error_detail: { key: "forbidden", category: "forbidden", target: "global" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            The same validation refusal as the `400`, answered to a browser form submitted
            without JavaScript (a `POST` carrying `_method=PUT` and an `Accept` that names
            `text/html`): the localized message as `text/html`, with the link back described on
            the `403`. A JSON or HTMX caller never receives this status; it gets the `400` and
            its envelope.
          content:
            text/html:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [days]
      summary: Delete a single day's entry (owner only).
      description: |
        The optional `source` query parameter (`dashboard` or `calendar`)
        selects the HTMX response shape used by the browser UI; programmatic
        clients can omit it and receive `204 No Content`.
      parameters:
        - in: query
          name: source
          required: false
          schema: { type: string, enum: [dashboard, calendar] }
          description: HTMX response selector (browser UI only).
      responses:
        '204':
          description: Deleted (programmatic client).
        '200':
          description: HTMX/browser response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The caller is not the owner, or the request was refused before the handler runs
            (CSRF) with the shared `forbidden` key.

            A caller that asks for JSON gets the JSON envelope. A browser form submitted without
            JavaScript — a `POST` carrying the hidden `_method=DELETE` field, with an `Accept`
            that names `text/html` — gets the shared localized status fragment as `text/html`
            instead, ending with a link back to the calendar day when `source=calendar` and to
            `/dashboard` otherwise. The link is fixed by the route, and no cookie, flash
            included, is set.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "forbidden"
                error_detail: { key: "forbidden", category: "forbidden", target: "global" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            The same validation refusal as the `400`, answered to a browser form submitted
            without JavaScript (a `POST` carrying `_method=DELETE` and an `Accept` that names
            `text/html`): the localized message as `text/html`, with the link back described on
            the `403`. A JSON or HTMX caller never receives this status.
          content:
            text/html:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/days/{date}/cycle-start:
    post:
      tags: [days]
      summary: Mark the day as the start of a new cycle (owner only).
      description: |
        Action on a day resource. Optional form flags control merge behavior
        with any pre-existing data on the day.
      parameters:
        - $ref: '#/components/parameters/DateParam'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                replace_existing: { type: string, enum: ["true", "false"] }
                mark_uncertain: { type: string, enum: ["true", "false"] }
                ack_period_tip: { type: string, enum: ["true", "false"] }
      responses:
        '200':
          description: Cycle start marked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400':
          description: |
            The date is invalid for a manual cycle start, or the mark closes a short gap
            and was sent without `mark_uncertain=true`.

            A caller that sends no `Accept` header, or one naming `application/json`, gets
            the JSON envelope below. An HTMX request (`HX-Request: true`), and a browser form
            submission whose `Accept` names `text/html`, get the localized status fragment
            as `text/html` instead. For the browser that fragment is the whole page, so it
            ends with a link back to the calendar day when `source=calendar`, and to
            `/dashboard` otherwise.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The day already carries a cycle start (or data that marking one would
            overwrite). Resend with `replace_existing=true` to take it.

            The carrier follows the same rule as the `400` above: an HTMX request or a
            `text/html` browser form submission gets the localized fragment with its link
            back, and every other caller gets the JSON envelope.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "cycle start replace required"
                error_detail: { key: "cycle start replace required", category: "conflict", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }

  # =========================================================================
  # symptoms
  # =========================================================================
  /api/v1/symptoms:
    get:
      tags: [symptoms]
      summary: List symptoms for the current user.
      responses:
        '200':
          description: Symptoms array.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Symptom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [symptoms]
      summary: Create a custom symptom (owner only).
      description: |
        A refusal raised before the handler runs (a stale CSRF token, a rate limit) answers a
        browser form submission without JavaScript — `Accept` names `text/html` — with the
        shared localized status fragment as `text/html`, under the refusal's own status and
        key, ending with a link back to `/settings`, instead of the JSON envelope. Every other
        caller keeps the JSON envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SymptomPayload' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Symptom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/symptoms/{id}:
    parameters:
      - $ref: '#/components/parameters/SymptomId'
    patch:
      tags: [symptoms]
      summary: Update a symptom (owner only).
      description: |
        A refusal raised before the handler runs (a stale CSRF token, a rate limit) answers a
        browser form submission without JavaScript — `Accept` names `text/html`, the form's
        hidden `_method` field makes it arrive as PATCH — with the shared localized status
        fragment as `text/html`, under the refusal's own status and key, ending with a link back
        to `/settings`, instead of the JSON envelope. Every other caller, one that sends PATCH
        itself included, keeps the JSON envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SymptomPayload' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Symptom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [symptoms]
      summary: Archive (soft-delete) a symptom (owner only).
      description: |
        Soft-deletes the symptom by setting `archived_at`. Existing daily log
        entries that reference the symptom keep the ID so historical entries
        remain readable; new entries cannot select an archived symptom until
        it is restored via `POST /api/v1/symptoms/{id}/restore`.

        A refusal raised before the handler runs (a stale CSRF token, a rate limit) answers a
        browser form submission without JavaScript — `Accept` names `text/html`, the form's
        hidden `_method` field makes it arrive as DELETE — with the shared localized status
        fragment as `text/html`, under the refusal's own status and key, ending with a link back
        to `/settings`, instead of the JSON envelope. Every other caller, one that sends DELETE
        itself included, keeps the JSON envelope.
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/symptoms/{id}/restore:
    post:
      tags: [symptoms]
      summary: Restore a previously archived symptom (owner only).
      description: |
        A refusal raised before the handler runs (a stale CSRF token, a rate limit) answers a
        browser form submission without JavaScript — `Accept` names `text/html` — with the
        shared localized status fragment as `text/html`, under the refusal's own status and
        key, ending with a link back to `/settings`, instead of the JSON envelope. Every other
        caller keeps the JSON envelope.
      parameters:
        - $ref: '#/components/parameters/SymptomId'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

