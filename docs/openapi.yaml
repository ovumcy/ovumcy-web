  /api/v1/exports/json:
    get:
      tags: [export]
      summary: Download full data as JSON (owner only).
      parameters:
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: JSON download.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: 'attachment; filename="ovumcy-export-2026-05-17.json"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/imports/json:
    post:
      tags: [export]
      summary: Restore a prior JSON export into the current account (owner only).
      description: |
        Additive restore of a prior `/api/v1/exports/json` payload: creates only
        the days the account does not already have. Existing days are never
        overwritten or deleted, so no re-authentication is required (unlike
        clear-data). Every field is re-validated server-side and scoped to the
        session owner; malformed or duplicate day records are dropped and
        reported in the counts rather than aborting the restore. State-mutating,
        so CSRF-protected. See [docs/export.md](export.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportJSON' }
      responses:
        '200':
          description: Restore summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: |
            Payload exceeds the size or entry-count limit. Two independent caps
            produce two different keys **and two different categories**, because
            they measure different things at different moments:
            `import file too large` / `validation` from the entry cap (20 000),
            counted on a payload that already parsed; and `request_too_large` /
            `too_large` from the 16 MiB body limit, which the server enforces
            before the handler runs — on the wire body and, when the request is
            compressed, on its decompressed size — without looking at the
            content at all. Branch on `error_detail`, not on the status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "import file too large"
                error_detail: { key: "import file too large", category: "validation", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }

  # =========================================================================
  # users/current — whoami, settings, and account management
  # =========================================================================
  /api/v1/users/current:
    get:
      tags: [settings]
      summary: Identity of the session subject.
      description: |
        Returns the minimum representation of the signed-in user a wrapper
        needs to learn who it is talking to: identity (id, email, display
        name), authorization tier (role), and lifecycle flags it must respect
        before mutating calls (onboarding_completed, local_auth_enabled,
        must_change_password). Sensitive fields are never included.
      responses:
        '200':
          description: Current user shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [settings]
      summary: Delete the current account and all related data (owner only).
      description: |
        Requires the current password. Deletes daily_logs, all symptoms for the
        user (including built-ins), the users row, and cascade-deletes
        `oidc_identities`. See [SECURITY.md "Retention and Deletion"](../SECURITY.md#retention-and-deletion).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordOnlyRequest' }
      responses:
        '200':
          description: Account deleted. Auth cookies cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/current/profile:
    patch:
      tags: [settings]
      summary: Update display name (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/interface:
    patch:
      tags: [settings]
      summary: Update interface preferences (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterfaceSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/tracking:
    patch:
      tags: [settings]
      summary: Update tracking preferences (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/timezone:
    post:
      tags: [settings]
      summary: Update the owner's IANA timezone (owner only).
      description: |
        Persists the browser-detected IANA timezone the client posts once per
        session when it differs from the value the server already holds. The
        name is validated server-side (non-IANA input and the "Local" token are
        rejected); the write is scoped to the session `user_id`. Does NOT bump
        `auth_session_version`. Returns `204 No Content` for HTMX requests,
        otherwise a JSON ack (the timezone value itself is never echoed back).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimezoneSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '204':
          description: Saved (HTMX request).
        '400':
          description: Invalid or unsupported timezone name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/webhook:
    post:
      tags: [settings]
      summary: Update webhook notification settings (owner only).
      description: |
        Persists the owner's webhook reminder settings: the enable toggle, the
        two per-kind notify toggles, and the endpoint URL. The URL is a secret
        (it may embed an ntfy/Gotify token) and is **write-only** — it is
        encrypted at rest and is NEVER returned by any endpoint (the settings
        page renders only a "configured"/"not configured" status plus, at most,
        the hostname). A blank `webhook_url` means "leave the stored endpoint
        unchanged"; set `webhook_remove_url: true` to clear it. Enabling delivery
        requires a valid `http`/`https` URL (a `400` with `invalid webhook url`
        otherwise). Does NOT bump `auth_session_version`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400':
          description: |
            Invalid webhook URL (empty when enabling, or non-http(s) scheme), or
            `webhook url unreadable` when the field was left blank - meaning "keep
            the stored endpoint" - and the stored ciphertext no longer opens under
            this instance's key. The second case is refused rather than resolved
            to an empty endpoint, because that silently deleted the endpoint the
            request asked to keep; withdraw it with `DELETE` instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "invalid webhook url"
                error_detail: { key: "invalid webhook url", category: "validation", target: "settings_form" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [settings]
      summary: Withdraw the stored webhook endpoint (owner only).
      description: |
        Withdraws the owner's delivery endpoint and switches delivery off, in one
        request. It writes only the endpoint columns: the two per-kind notify
        toggles and the shared `reminder_lead_days` window are left exactly where
        the owner set them, because withdrawing an address is not a request to
        forget which reminders they wanted or how early. It advances the
        revocation epoch in the same statement, so a delivery pass already
        holding the previous configuration loses its claim rather than posting to
        a withdrawn endpoint, and it clears the accepted-delivery mark, which
        describes an endpoint that no longer exists.

        It never decrypts the stored ciphertext, which is what makes an endpoint
        this instance can no longer read (after a `SECRET_KEY` rotation) still
        withdrawable. Idempotent. Does NOT bump `auth_session_version`.
      responses:
        '200':
          description: Endpoint withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Persistence failed. Carries no endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "failed to update webhook settings"
                error_detail: { key: "failed to update webhook settings", category: "internal", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/calendar-feed:
    post:
      tags: [settings]
      summary: Generate (enable) the calendar (.ics) feed (owner only).
      description: |
        Mints a fresh read-only `.ics` subscribe token for the owner and enables
        the feed. If a feed is already configured this rotates it (the previous
        URL dies immediately). The subscribe URL embeds a bearer capability token
        and is therefore a **write-only secret**: it is NEVER returned in the
        response body, a query string, a redirect target, or any log. Instead it
        is sealed into a one-time cookie (`ovumcy_calendar_feed`) and revealed
        exactly once on the reveal page. JSON clients receive only the outcome
        status plus `next_path` to that reveal page (see
        `CalendarFeedRevealResponse`) — never the URL or token. Does NOT bump
        `auth_session_version` (a per-surface feed capability is not an account
        credential). The read-only feed page itself, `GET /calendar/feed/{token}.ics`,
        is a non-`/api/v1` page route authenticated by the path token alone and is
        intentionally out of scope for this OpenAPI document.
      responses:
        '200':
          description: Feed enabled. JSON clients follow `next_path` to the one-time reveal of the subscribe URL (shown exactly once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarFeedRevealResponse' }
        '303':
          description: "Browser redirect to the one-time reveal page (`/settings/calendar-feed`) when `Accept: application/json` is not set."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Token generation or persistence failed. Carries no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "failed to update calendar feed"
                error_detail: { key: "failed to update calendar feed", category: "internal", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [settings]
      summary: Revoke (disable) the calendar (.ics) feed (owner only).
      description: |
        Disables the owner's feed by clearing both token columns. Any
        previously-issued subscribe URL 404s immediately (its selector resolves
        no row). Idempotent — revoking an already-disabled feed still succeeds.
        Carries no secret. Does NOT bump `auth_session_version`.
      responses:
        '200':
          description: Feed disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Persistence failed. Carries no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "failed to update calendar feed"
                error_detail: { key: "failed to update calendar feed", category: "internal", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/calendar-feed/rotate:
    post:
      tags: [settings]
      summary: Rotate the calendar (.ics) feed token (owner only).
      description: |
        Mints a NEW subscribe token, invalidating the previous one — the old URL
        stops resolving the instant this write commits (its selector no longer
        resolves and its verifier no longer matches). Used when the owner suspects
        the current URL leaked but wants to keep the feed enabled. Like generate,
        the new subscribe URL is a **write-only secret**: it is NEVER returned in
        the body, a query string, a redirect, or a log — it is sealed into the
        one-time `ovumcy_calendar_feed` cookie and revealed exactly once on
        `next_path`. Does NOT bump `auth_session_version`.
      responses:
        '200':
          description: Feed rotated. JSON clients follow `next_path` to the one-time reveal of the new subscribe URL (shown exactly once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarFeedRevealResponse' }
        '303':
          description: "Browser redirect to the one-time reveal page (`/settings/calendar-feed`) when `Accept: application/json` is not set."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Token generation or persistence failed. Carries no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "failed to update calendar feed"
                error_detail: { key: "failed to update calendar feed", category: "internal", target: "global" }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/cycle:
    patch:
      tags: [settings]
      summary: Update cycle settings (owner only).
      description: >-
        Partial: the request body carries the members to change, and every
        member it omits keeps its stored value. `CycleSettings` states what a
        present member and an absent one each mean. The success body is
        `OkResponse` and carries nothing else — including on the goal-only
        quick switch, which echoed the stored goal back until v2.0.0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/reminders:
    patch:
      tags: [settings]
      summary: Update reminder lead days (owner only).
      description: >-
        Sets the shared reminder lead window (users.reminder_lead_days) governing
        how many days ahead the dashboard period/ovulation reminder appears. The
        value is clamped to 0–14; it does not bump auth_session_version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/password:
    put:
      tags: [settings]
      summary: Change password (owner only, local-auth accounts).
      description: |
        For accounts with `local_auth_enabled=false` (OIDC-only), this endpoint
        returns `403 oidc reauth required` — those accounts must use the
        step-up flow at `POST /api/v1/users/current/password/step-up`. Bumps
        `auth_session_version` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: OIDC re-auth required for OIDC-only accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "oidc reauth required"
                error_detail: { key: "oidc reauth required", category: "forbidden", target: "settings_form" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/password/step-up:
    post:
      tags: [settings]
      summary: Begin the OIDC step-up flow to enable a local password (owner only, OIDC-only).
      description: |
        Validates the new password pair, stashes its bcrypt hash in a sealed
        cookie, and returns the provider's authorize URL. The caller sends the
        browser there; the provider re-authenticates the user; the callback at
        `/auth/oidc/callback` finalizes the local password and mints a
        recovery code. See [docs/oidc.md "How Auto-Provision Works"](oidc.md#how-auto-provision-works).

        A request that does not accept JSON (an ordinary form submit) is
        answered, on success, with a same-origin interstitial page instead of
        the JSON body, because the settings page CSP pins `form-action` to
        `'self'` across the whole redirect chain; the responses below describe
        the JSON surface, and a refusal on the browser one flashes onto
        `/settings` rather than carrying the status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLocalPasswordSetupRequest' }
      responses:
        '200':
          description: OIDC redirect URL emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartLocalPasswordSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/users/current/data-wipe/step-up:
    post:
      tags: [settings]
      summary: Begin the OIDC step-up that authorizes a data wipe (owner only, accounts without a local password).
      description: |
        Erasing health data always costs a fresh re-authentication. An account
        provisioned through OIDC has no local password to confirm with, so this
        endpoint starts the same step-up flow used for local-password
        enrollment and returns the provider's authorize URL. The confirmed
        operation is sealed into the step-up cookie, and the callback at
        `/auth/oidc/callback` performs the wipe once the provider has
        re-authenticated the owner.

        An account that **has** a local password is refused here: its erasure
        gate stays the password, so the SSO path can never be used to bypass it.

        A request that does not accept JSON (an ordinary form submit) is
        answered, on success, with a same-origin interstitial page instead of
        the JSON body, because the settings page CSP pins `form-action` to
        `'self'` across the whole redirect chain; the responses below describe
        the JSON surface, and a refusal on the browser one flashes onto
        `/settings` rather than carrying the status.
      responses:
        '200':
          description: OIDC redirect URL emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartLocalPasswordSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          description: The account has a local password, so this flow does not apply; the erasure is confirmed with that password instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "invalid settings input"
                error_detail: { key: "invalid settings input", category: "validation", target: "settings_form" }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/users/current/deletion/step-up:
    post:
      tags: [settings]
      summary: Begin the OIDC step-up that authorizes an account deletion (owner only, accounts without a local password).
      description: |
        The account-deletion counterpart of
        `POST /api/v1/users/current/data-wipe/step-up`; the same rules apply,
        including the refusal for accounts that hold a local password. The
        callback deletes the account and retracts the session.

        A request that does not accept JSON (an ordinary form submit) is
        answered, on success, with a same-origin interstitial page instead of
        the JSON body, because the settings page CSP pins `form-action` to
        `'self'` across the whole redirect chain; the responses below describe
        the JSON surface, and a refusal on the browser one flashes onto
        `/settings` rather than carrying the status.
      responses:
        '200':
          description: OIDC redirect URL emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartLocalPasswordSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          description: The account has a local password, so this flow does not apply; the erasure is confirmed with that password instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "invalid settings input"
                error_detail: { key: "invalid settings input", category: "validation", target: "settings_form" }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/users/current/oidc/link/step-up:
    post:
      tags: [settings]
      summary: Begin the OIDC step-up that authorizes linking a new OIDC identity to this account (owner only).
      description: |
        Linking an identity is a permanent `(issuer, subject)` → account
        binding, so it is authorized the same way the other step-ups in this
        section are: a fresh interactive re-authentication at the provider
        (`prompt=login`, `max_age=0`). This endpoint only mints the sealed
        step-up cookie and returns the provider's authorize URL — nothing is
        written until the callback at `/auth/oidc/callback` proves the fresh
        authentication, links the identity and redirects to `/settings`.

        A request that does not accept JSON (an ordinary form submit) is
        answered with a same-origin interstitial page instead of the JSON body,
        because the settings page CSP pins `form-action` to `'self'` across the
        whole redirect chain.
      responses:
        '200':
          description: OIDC redirect URL emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartLocalPasswordSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: SSO is disabled or the provider is unreachable, so the linking re-authentication cannot be started. Retryable once the provider is back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: "sso temporarily unavailable"
                error_detail: { key: "sso temporarily unavailable", category: "internal", target: "auth_form" }

  /api/v1/users/current/recovery-code:
    post:
      tags: [settings]
      summary: Issue a fresh recovery code (owner only).
      description: |
        Requires the current password (or OIDC-only accounts must first enrol a
        local password via the step-up flow). Bumps `auth_session_version`;
        other devices are signed out, the originating device is refreshed
        inline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordOnlyRequest' }
      responses:
        '200':
          description: Recovery code surface rendered. JSON clients should follow the redirect to `/recovery-code` to pick up the plaintext code (shown exactly once).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/2fa:
    put:
      tags: [settings]
      summary: Enable TOTP 2FA (owner only).
      description: |
        Requires the user's current password plus the 6-digit code generated
        against the secret stashed by the `GET /settings/2fa` setup page in
        the `ovumcy_totp_setup` cookie. Bumps `auth_session_version`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TOTPEnrollmentRequest' }
      responses:
        '200':
          description: 2FA enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '303':
          description: "Browser redirect to `/settings`, which reads the success flash, when `Accept: application/json` is not set."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [settings]
      summary: Disable TOTP 2FA (owner only).
      description: |
        Requires the current password. Per-account rate limit: 5 attempts /
        15 min. Bumps `auth_session_version`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PasswordOnlyRequest' }
      responses:
        '200':
          description: 2FA disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '303':
          description: "Browser redirect to `/settings`, which reads the success flash, when `Accept: application/json` is not set."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users/current/data-wipe/validate:
    post:
      tags: [settings]
      summary: Validate current password before showing the data-wipe confirmation (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordOnlyRequest' }
      responses:
        '200':
          description: Password OK, the client may proceed to the wipe endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '204':
          description: Same as 200 for non-JSON clients.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/current/data-wipe:
    post:
      tags: [settings]
      summary: Wipe per-account health data and reset preferences (owner only).
      description: |
        Deletes daily_logs, deletes user-defined symptoms (built-in symptoms
        remain), resets cycle and tracking preferences to documented defaults,
        and atomically bumps `auth_session_version` so other sessions are
        revoked. The originating device is refreshed inline.
        See [SECURITY.md "Retention and Deletion"](../SECURITY.md#retention-and-deletion).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordOnlyRequest' }
      responses:
        '200':
          description: Data wiped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
