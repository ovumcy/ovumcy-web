name: Docker Image

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must stay identical to security.yml's TRIVY_IMAGE. The pre-publish scan
  # below applies the same gate as the required `trivy-image` check to the exact
  # image this job is about to push, so the two must not drift apart.
  TRIVY_IMAGE: aquasec/trivy:0.68.2@sha256:05d0126976bdedcd0782a0336f77832dbea1c81b9cc5e4b3a5ea5d2ec863aca7

# A push to `main` no longer starts this workflow directly. It used to, which
# meant the publish job raced the test, e2e and scan jobs triggered by the same
# push and normally beat them: `:latest` was publicly pullable before anything
# had judged that commit, and a CRITICAL found by `trivy-image` minutes later
# was already live. `:latest` now follows `main` through ci.yml's
# `publish-image` job, which calls this workflow only once that commit's own
# checks have passed — `needs:` cannot cross workflow boundaries, so the gate
# has to live in the workflow that owns those jobs.
#
# Publishing stays in one workflow rather than being copied into ci.yml so that
# release tags and `:latest` are built, scanned, signed and attested by the same
# job, and so both keep the `docker-image.yml` keyless-signing identity that
# SECURITY.md tells operators to verify (a reusable workflow signs under its own
# ref, not the caller's).
on:
  push:
    tags:
      - "v*"
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        # Authenticated base-image pulls avoid the anonymous rate limit that causes
        # intermittent "i/o timeout" failures when resolving docker.io images.
        # Skipped if the secret is absent, so the build still works without it.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build runtime image for the pre-publish scan
        # Single-arch load of the image the next step pushes: same Dockerfile,
        # same BUILD_REVISION, so the scan below judges the published bytes
        # rather than an approximation. The multi-arch build then reuses these
        # layers from the GHA cache, so this costs a scan, not a second build.
        # Only linux/amd64 is scanned — the same platform coverage the
        # `trivy-image` check has today; `load: true` cannot hold a multi-arch
        # index, and the runtime image is a static binary over a `scratch` base,
        # so its package inventory does not vary by architecture.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ovumcy-publish-scan:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull Trivy image
        uses: ./.github/actions/docker-pull-retry
        with:
          image: ${{ env.TRIVY_IMAGE }}

      - name: Scan the image before publishing it
        # Same gate as security.yml's required `trivy-image` check — same
        # scanner, severity threshold, `--ignore-unfixed` and `--exit-code 1`.
        # That check lives in another workflow and so cannot be a `needs:` of
        # this job; repeating the scan here against the exact artifact is what
        # keeps an unscanned image from reaching the registry. Output is a table
        # rather than SARIF because the Security tab entry for this commit
        # already comes from `trivy-image`; a second upload under the same
        # category would only overwrite it.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${{ env.TRIVY_IMAGE }}" image --scanners vuln --skip-version-check --severity HIGH,CRITICAL --ignore-unfixed --format table --exit-code 1 ovumcy-publish-scan:${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the commit sha into the binary (main.buildVersion) so the
          # published image serves a per-release asset cache-bust token.
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select public image reference
        id: public_ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "value=latest" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous GHCR pull access
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_REF: ${{ steps.public_ref.outputs.value }}
        run: |
          set -euo pipefail

          token_body="$(mktemp)"
          manifest_body="$(mktemp)"
          trap 'rm -f "$token_body" "$manifest_body"' EXIT

          token_status="$(
            curl -sSLo "$token_body" -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY}:pull"
          )"

          if [[ "$token_status" != "200" ]]; then
            echo "::error::Anonymous GHCR token request for ${IMAGE_NAME}:${IMAGE_REF} returned HTTP ${token_status}. Ensure the package is linked to ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} and that the package visibility is set to public."
            cat "$token_body"
            exit 1
          fi

          token="$(
            python3 -c 'import json, pathlib, sys; body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); print(body.get("token", ""))' "$token_body"
          )"

          if [[ -z "$token" ]]; then
            echo "::error::Anonymous GHCR token response for ${IMAGE_NAME}:${IMAGE_REF} did not include a bearer token."
            cat "$token_body"
            exit 1
          fi

          manifest_status="$(
            curl -sSLo "$manifest_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${GITHUB_REPOSITORY}/manifests/${IMAGE_REF}"
          )"

          if [[ "$manifest_status" != "200" ]]; then
            echo "::error::Anonymous GHCR manifest request for ${IMAGE_NAME}:${IMAGE_REF} returned HTTP ${manifest_status}. Ensure the package is publicly pullable before considering this release published."
            cat "$manifest_body"
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
