name: ClusterFuzzLite PR

# Fuzz only the code a pull request changes, before it merges. Runs entirely on
# GitHub Actions — no external fuzzing service. A crash fails the check and the
# reproducer is attached to the run as an artifact.
on:
  pull_request:
    branches:
      - main
    # PR fuzzing can only catch regressions introduced through fuzzable
    # inputs, and the Go+libFuzzer toolchain occasionally SEGVs at process
    # startup (TracePC::ClearInlineCounters) independent of the change under
    # test — so docs/CI-only PRs skip it instead of rolling that dice. The
    # "PR" context is not a required check, so a workflow-level paths filter
    # is safe here (nothing waits on a report that never comes). The daily
    # batch workflow still fuzzes every target regardless.
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".clusterfuzzlite/**"

permissions:
  contents: read

jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
