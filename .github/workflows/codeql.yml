name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  # Merge-queue validation runs: every workflow that owns a required status
  # check must also report on merge_group, or a queued merge waits forever.
  merge_group:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR, so a rapid
# string of fixup pushes doesn't queue every intermediate run to completion.
# Only cancels pull_request runs — push (main), the weekly schedule, and
# workflow_dispatch always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shares ci.yml's `changes` base resolution through the diff-against-base
  # action, and its fail-safe (unknown event, missing base, failed or empty
  # diff all leave every language running): only pull_request/merge_group
  # ever narrow anything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_go: ${{ steps.detect.outputs.run_go }}
      run_js: ${{ steps.detect.outputs.run_js }}
      run_actions: ${{ steps.detect.outputs.run_actions }}

    steps:
      # Only a pull request and a merge group carry a base to diff against, so
      # only they pay for a full-history checkout; every other event reaches
      # the detect step with no file list and runs every language.
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: List the files this diff changes
        id: diff
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./.github/actions/diff-against-base

      - name: Detect which CodeQL languages this diff can affect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES_PATH: ${{ steps.diff.outputs.files-path }}
          DIFF_VERDICT: ${{ steps.diff.outputs.verdict }}
        run: |
          # This job must never fail: a failed dependency would skip every
          # Analyze leg into a SATISFIED required check. The runner executes a
          # step with no `shell:` as `bash -e`, so errexit IS on here — every
          # command that may exit non-zero is guarded (`|| true`). Every
          # output starts at true, and an empty file list leaves it there.
          run_go=true
          run_js=true
          run_actions=true

          # The list arrives as a file the diff action wrote, never through
          # `env:` (one env string is capped at 128 KiB). No path, or a file
          # that cannot be read, is an empty list: nothing is narrowed.
          files=""
          if [ -n "$CHANGED_FILES_PATH" ] && ! files="$(cat -- "$CHANGED_FILES_PATH")"; then
            files=""
            DIFF_VERDICT="the file list at $CHANGED_FILES_PATH could not be read"
          fi
          if [ -z "$files" ]; then
            verdict="${DIFF_VERDICT:-$EVENT_NAME carries no base to diff against}: running every language."
          else
            # This workflow file carries the paths-ignore config inline, so an
            # edit to it forces every language rather than being judged by the
            # rules below. The diff action is this detection's other half —
            # it decides which files the rules below ever see — so an edit
            # to it forces every language too, as it did while that logic
            # lived in this file.
            workflow_changed="$(printf '%s\n' "$files" | grep -E '^\.github/workflows/codeql\.yml$|^\.github/actions/diff-against-base/' || true)"

            go_changes="$(printf '%s\n' "$files" | grep -E '(\.go$|^go\.mod$|^go\.sum$)' || true)"
            # javascript-typescript has no `paths:` restriction above (only
            # the two paths-ignore entries), so CodeQL extracts every
            # JS/TS/HTML/Vue source in the tree: web/src/js, the go:embed'ed
            # templates (inline <script> and on* handlers —
            # internal/templates/*.html), the e2e specs, scripts/, the root
            # tooling configs, and the npm manifests and lockfiles at any
            # depth plus tsconfig*.json that shape what gets extracted.
            js_changes="$(printf '%s\n' "$files" | grep -E '(\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|html|htm|vue)$|(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json)$|(^|/)tsconfig[^/]*\.json$)' || true)"
            actions_changes="$(printf '%s\n' "$files" | grep -E '^\.github/' || true)"

            if [ -n "$workflow_changed" ]; then
              verdict="codeql.yml or the diff action it lists with changed: running every language."
            else
              run_go=false
              run_js=false
              run_actions=false
              [ -n "$go_changes" ] && run_go=true
              [ -n "$js_changes" ] && run_js=true
              [ -n "$actions_changes" ] && run_actions=true
              verdict="scoped to what changed: go=$run_go javascript-typescript=$run_js actions=$run_actions."
            fi
          fi

          echo "$verdict"
          echo "run_go=$run_go" >> "$GITHUB_OUTPUT"
          echo "run_js=$run_js" >> "$GITHUB_OUTPUT"
          echo "run_actions=$run_actions" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # `!cancelled()` overrides the implicit success()-of-needs predicate: a
    # FAILED or cancelled `changes` job would otherwise skip every leg into a
    # satisfied `Analyze (*)` required check instead of running it. Mirrors
    # ci.yml's gated jobs and security.yml's `changes`-gated jobs above.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    # Deliberately step-gated, not job-gated: this job is a required check
    # named per matrix leg (`Analyze (go)`, `Analyze (javascript-typescript)`,
    # `Analyze (actions)`), and every step below is skipped instead of the
    # whole job so each leg keeps reporting under its own name and conclusion
    # exactly as it does today — mirrors ci.yml's e2e-shard job, which chose
    # the same shape for the same reason (a required check must not move to a
    # name GitHub renders differently on skip). A job-level `if` referencing
    # `matrix.language` is a documented pattern and would likely resolve to
    # the identical name too, but that composition has not been exercised
    # live against this required-check set, and the cost of being wrong is a
    # stuck merge queue — so the proven shape wins here.
    # RUN_THIS_LANGUAGE is an AND of per-language NEGATIONS, not an OR of
    # per-language positives: with an OR, a matrix leg added later (a
    # fourth language) would match none of the three named terms and never
    # run at all, even on push/schedule — fail-CLOSED for anything this
    # expression doesn't already know by name. Framed as "run unless THIS
    # leg's own output is exactly 'false'", a leg outside {go,
    # javascript-typescript, actions} is true by construction: none of the
    # three `matrix.language == '<x>' && ...` guards match it, so every
    # `!(false && …)` term is `!false` and the whole AND is true.
    env:
      RUN_THIS_LANGUAGE: >-
        ${{
          !(matrix.language == 'go' && needs.changes.outputs.run_go == 'false') &&
          !(matrix.language == 'javascript-typescript' && needs.changes.outputs.run_js == 'false') &&
          !(matrix.language == 'actions' && needs.changes.outputs.run_actions == 'false')
        }}

    steps:
      - name: Checkout
        if: env.RUN_THIS_LANGUAGE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go' && env.RUN_THIS_LANGUAGE == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        if: env.RUN_THIS_LANGUAGE == 'true'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              # The app/ and settings-export/ sources are non-standalone IIFE
              # fragments (wrapper open/close and shared closure split across
              # files), so they fail standalone extraction. Their logic is
              # analyzed through the concatenated bundles in web/static/js,
              # which build-js.mjs keeps in sync (CI stale-bundle guard).
              - web/src/js/app
              - web/src/js/settings-export

      - name: Build Go packages
        if: matrix.language == 'go' && env.RUN_THIS_LANGUAGE == 'true'
        run: go build ./...

      - name: Analyze
        if: env.RUN_THIS_LANGUAGE == 'true'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
