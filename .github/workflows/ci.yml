name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Merge-queue validation runs: every workflow that owns a required status
  # check must also report on merge_group, or a queued merge waits forever.
  merge_group:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR, so a rapid
# string of fixup pushes doesn't queue every intermediate run to completion.
# Only cancels pull_request runs — push (main), release, and workflow_dispatch
# always run to completion, since each may gate a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Split from a single `test` job into test-go/test-frontend: the two halves
  # never depended on each other's output, so running them as parallel jobs
  # instead of sequential steps shortens wall-clock to roughly max(go, frontend)
  # instead of their sum. Downstream jobs that only need the Go side (coverage
  # upload, patch-coverage) depend on test-go alone; jobs that gate on "did
  # everything basic pass" (e2e, e2e-postgres-smoke) depend on both.
  test-go:
    runs-on: ubuntu-latest
    # Whole-job skip on `run_core` (see the `changes` job), which now clears
    # for TWO reasons: a docs-only diff, and a `push` to `main`, where the
    # merge queue already ran this lane on the identical commit. coverage-upload
    # and patch-coverage cascade off this job's skip through their needs edge,
    # and the thin `test` gate job follows both unit jobs the same way.
    #
    # The shape the whole battery shares: run unless `changes` positively
    # determined this run does not need it. A detection job that failed leaves
    # the output empty, which is not 'false', so the lane still runs — a
    # skipped required check would otherwise pass the merge on no evidence.
    needs:
      - changes
    if: ${{ !cancelled() && needs.changes.outputs.run_unit != 'false' }}
    permissions:
      contents: read

    # Each pinned analysis-tool version lives here, in exactly ONE place,
    # because the binary cache key below is built from these same values. A key
    # repeating the version as its own literal would be keyed on a SPELLING
    # rather than on the thing: bumping a `go install` line and forgetting the
    # key hands every later run the OLD binary out of cache, silently, while the
    # workflow reads as though it had been bumped.
    env:
      # git SHA for v0.6.1 (tag 2025.1.1): b8ec13ce4d00445d75da053c47498e6f9ec5d7d6 (verified via go list -m -json)
      STATICCHECK_VERSION: v0.6.1
      # git SHA for golang.org/x/tools v0.49.0: 18332fec72972efbb8ab9881984fec2d8cfc2b58 (verified via go list -m -json)
      DEADCODE_VERSION: v0.49.0
      # git SHA for v2.12.2: c0d3ddc9cf3faa61a4e378e879ece580256d76e5 (verified via go list -m -json)
      GOLANGCI_LINT_VERSION: v2.12.2
      # git SHA for v1.7.12: 914e7df21a07ef503a81201c76d2b11c789d3fca (verified via go list -m -json)
      ACTIONLINT_VERSION: v1.7.12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Caches the tool BINARIES. This is NOT the forbidden analysis cache, and
      # the difference is the whole reason it is allowed: golangci-lint's
      # analysis cache stores facts derived from a source tree that an
      # actions/cache key cannot name, so a hit can carry a verdict computed
      # against different code — that is what produced six deterministic phantom
      # SA5011 findings (2026-08-03; see the note above the golangci-lint step).
      # A compiled binary carries no facts about this repository at all: it is a
      # pure function of its pinned version and the toolchain that built it, and
      # the key names both in full.
      #
      # No `restore-keys`: a prefix match would serve a binary of a DIFFERENT
      # pinned version, the exact failure the full key exists to prevent. A miss
      # costs the 54 s below and nothing else.
      #
      # Measured 2026-08-15 on run 31849738519: `Install golangci-lint` 41 s,
      # `Install staticcheck` 9 s, `Install deadcode` 4 s, on a 7 min 23 s job.
      - name: Cache Go tool binaries
        id: go-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gotools-go${{ steps.setup-go.outputs.go-version }}-staticcheck${{ env.STATICCHECK_VERSION }}-deadcode${{ env.DEADCODE_VERSION }}-golangcilint${{ env.GOLANGCI_LINT_VERSION }}-actionlint${{ env.ACTIONLINT_VERSION }}

      - name: Verify the restored binaries are the pinned versions
        # A cache hit is only as good as its key, and a key that quietly stopped
        # tracking a bump would lint this repository with the wrong tool while
        # every step stayed green. This turns that into a red step.
        #
        # Both tools print the version WITHOUT the leading `v` (measured
        # 2026-08-15: `staticcheck.exe 2025.1.1 (0.6.1)` and `golangci-lint has
        # version 2.12.2 built with ...`), so the pin is matched with `${VAR#v}`
        # — grepping the tag as written would fail every cache hit. `deadcode`
        # has no version flag; the key covers it and its own step fails loudly
        # if the binary is missing.
        if: steps.go-tools.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          "$bin/staticcheck" -version | grep -F "(${STATICCHECK_VERSION#v})"
          "$bin/golangci-lint" --version | grep -F "version ${GOLANGCI_LINT_VERSION#v} "
          "$bin/actionlint" -version | grep -Fx "$ACTIONLINT_VERSION"
          test -x "$bin/deadcode"

      - name: Install staticcheck
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"

      # The Go wildcards in this job are scoped to our module's package trees
      # (cmd, internal, migrations, scripts, web) instead of ./... — this job
      # never runs `npm ci`, so there is no node_modules/ to sweep in, but the
      # explicit tree list stays for consistency with the other Go jobs (race,
      # patch-coverage) and to keep matching `-coverpkg` below. Keep the tree
      # list in sync with `go list ./...`.
      - name: Staticcheck
        run: '"$(go env GOPATH)/bin/staticcheck" ./cmd/... ./internal/... ./migrations/... ./scripts/... ./web/...'

      - name: Install deadcode
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: go install "golang.org/x/tools/cmd/deadcode@$DEADCODE_VERSION"

      # A barrier, not a detector: this reports nothing on the tree it was added
      # to, and its job is to keep it that way. Measured 2026-08-15 — it found
      # none of the ~40 declarations the dead-code campaign removed, because it
      # analyses functions only (types and vars are out of scope) and counts a
      # caller as a caller even when the caller is itself dead: three services
      # functions were reached from a templateFuncMap entry no template used.
      # What it does catch is a NEW function that nothing can reach.
      #
      # -test keeps deliberate test seams out of the verdict, and the scope
      # without it is deliberately NOT wired.
      #
      # Decision (2026-08-15): the nine declarations that were reachable only
      # from tests are resolved — moved into test files, or re-pointed at the
      # production path they were shadowing — and the production scope is still
      # red, on two seams no code change removes. internal/testdb is test support
      # shared by several packages' tests, so it can never live in a _test.go;
      # i18n.PluralCategories is the single source of truth for a language's CLDR
      # category set and is read from two packages' tests for the same reason.
      # Wiring the scope would therefore mean carrying an exception list, and a
      # list that grows by one line per audit is what it was meant to replace.
      #
      # The reachability it would have guaranteed is covered by purpose-built
      # barriers instead, each failing on the layer deadcode cannot see:
      # TestEveryTemplateFuncIsCalledByATemplate (internal/api) and
      # TestEveryLocaleKeyIsReachableFromTheApplication (internal/i18n).
      #
      # deadcode exits 0 with findings on stdout, so the output is what decides.
      - name: Go dead code
        shell: bash
        run: |
          findings="$("$(go env GOPATH)/bin/deadcode" -test ./cmd/... ./internal/... ./migrations/... ./scripts/... ./web/...)"
          if [[ -n "${findings}" ]]; then
            printf '%s\n' "${findings}"
            exit 1
          fi

      - name: Install golangci-lint
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"

      - name: Install actionlint
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

      # The workflows are 1757 lines across ten files, a good deal of it bash
      # inside `run:`, and nothing checked any of it. actionlint reads what YAML
      # alone cannot: undefined `steps.*`/`needs.*` references, contexts used
      # where they are not available, and `${{ }}` interpolated straight into a
      # shell script (the script-injection class). Proved in both directions on
      # 2026-08-15 — the ten workflows report nothing, and a copy carrying a
      # bogus `steps.*` reference plus an interpolated PR title reports both and
      # exits 1.
      #
      # shellcheck is DISABLED explicitly rather than left to the runner. The
      # ubuntu image ships shellcheck, so actionlint would silently add a whole
      # second analyser whose findings this repository has never measured, at a
      # version the image chooses and can change under us — a barrier that means
      # something different on each runner is not a barrier. Enabling it is a
      # separate change that starts by measuring the findings.
      - name: Lint the workflows
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck='

      # No cache for golangci-lint's own analysis cache: its key can only name
      # go.sum and .golangci.yml, never the source tree, so a branch whose
      # dependencies are unchanged but whose commits moved reuses facts computed
      # against a different tree. That produced six deterministic phantom
      # SA5011 findings on a dependency bump (2026-08-03) that reproduced on no
      # other machine, and deleting the entry turned the same commit green.
      # Restoring it bought 1-5 s on a ~6 min job, against ~40 s just to install
      # the linter — reinstate only with a key that covers the sources.
      - name: golangci-lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run ./cmd/... ./internal/... ./migrations/... ./scripts/... ./web/...'

      - name: Go vet
        run: go vet ./cmd/... ./internal/... ./migrations/... ./scripts/... ./web/...

      - name: Go test with coverage
        # -coverpkg credits a line when ANY test exercises it (including
        # cross-package integration tests), not only its own package's unit
        # tests. The patch-coverage gate consumes this profile. Scoped to the
        # module trees (see the note above the Staticcheck step).
        #
        # `-timeout 20m` declares a budget that was previously left implicit.
        # Go's default is 10 minutes PER PACKAGE, and internal/api sits right at
        # that edge: measured 2026-08-15 on a dev host, 603 s run alone and 610 s
        # inside `go test ./...`, with coverage instrumentation slower still
        # (-covermode=atomic adds an atomic counter per block). The lane passed
        # only because the runner happens to be faster than a dev host, which is
        # not a margin anyone chose.
        #
        # What the budget prevents does not read as "this needed more time": the
        # runtime panics with `test timed out after 10m0s` and dumps every
        # goroutine, so a required check fails with a stack trace that reads like
        # a product bug. Every `go test` in this file that runs a suite declares
        # the same budget — fixing only the lane where the pressure was measured
        # would leave the identical default armed in three other spellings.
        run: go test ./cmd/... ./internal/... ./migrations/... ./scripts/... ./web/... -timeout 20m -coverprofile=coverage.out -covermode=atomic -coverpkg=./cmd/...,./internal/...,./migrations/...,./scripts/...,./web/...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  test-frontend:
    runs-on: ubuntu-latest
    needs:
      - changes
    # Same fail-safe gate as test-go above.
    if: ${{ !cancelled() && needs.changes.outputs.run_core != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        # Now scoped over e2e/ and playwright.config.ts as well. Until it was,
        # the 47 .ts files of the browser suite were checked by nothing at all:
        # this script never named them and TypeScript was not a dependency.
        # Type-AWARE for those files, which is what buys `no-floating-promises`
        # — a Playwright call whose `await` went missing still passes today,
        # because the assertion it should have made never runs before the test
        # ends. Measured 2026-08-15: 6.1 s locally for the whole scope.
        run: npm run lint:js

      - name: Type-check the browser e2e suite
        # The other half of the same hole. A broken signature or a dangling
        # import in e2e/ used to reach CI only as a failing spec, minutes into
        # a browser run; `tsc --noEmit` reports it in seconds. The first run of
        # this check found six defects — three declarations nothing read and
        # three reads of a possibly-null response — which are fixed in the same
        # change, because a barrier that ships with a baseline is a list, not a
        # barrier. Measured 2026-08-15: 2.4 s locally.
        run: npm run lint:types

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npm run build

      - name: Committed bundles must match a fresh build
        # Stale-bundle guard: the production image ships the committed
        # web/static assets while e2e jobs test freshly built ones, so a
        # source change committed without `npm run build` would ship bundles
        # that were never tested. The build is hermetic and reproducible
        # (explicit @source list in web/src/css/input.css; JS bundling is
        # plain concatenation), so any diff here is a real stale bundle.
        run: |
          git diff --exit-code -- web/static/
          test -z "$(git status --porcelain -- web/static/)"

  # Thin gate job named exactly `test` — branch protection's required status
  # check is pinned to that literal context name (verified via `gh api
  # repos/ovumcy/ovumcy-web/rules/branches/main`). Renaming or removing the
  # `test` job outright would leave that required check permanently
  # unsatisfied and block every future PR; this job keeps the name while the
  # actual work runs in the parallel test-go/test-frontend jobs above.
  test:
    runs-on: ubuntu-latest
    needs:
      - test-go
      - test-frontend
    # WITHOUT AN `if`, A FAILED DEPENDENCY SKIPS THIS JOB — and a skipped
    # required check counts as satisfied, so a failing Go suite left no required
    # context red at all. Measured 2026-08-08 on a throwaway branch carrying one
    # deliberately failing test: `test-go` failed, and `test`, `e2e` and
    # `patch-coverage` — three of the fourteen required contexts — all reported
    # SKIPPED. `race` gates on `changes` rather than on this job, so it ran and
    # passed, and nothing else covered the unit suite.
    #
    # `!cancelled()` makes this job RUN whatever its dependencies did, and the
    # step below turns their results into this context's verdict. A cancelled
    # run is still excluded: a superseded PR run must not report a failure.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Judge the two unit halves
        env:
          GO_RESULT: ${{ needs.test-go.result }}
          FRONTEND_RESULT: ${{ needs.test-frontend.result }}
        run: |
          set -euo pipefail
          echo "test-go=$GO_RESULT test-frontend=$FRONTEND_RESULT"
          # `skipped` is a PASS here and only here: the `changes` job cleared
          # `run_core` — the diff was docs-only, or this is a `push` whose core
          # suite the merge queue already ran on the identical commit. Either
          # way it is a decision not to run, not a failure to run. Anything else
          # — failure, cancelled, or a state this gate has never seen — is this
          # context's failure, because the whole point of the job is to have a
          # verdict to report.
          for result in "$GO_RESULT" "$FRONTEND_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a unit half reported \"$result\""; exit 1 ;;
            esac
          done
          echo "test-go and test-frontend passed."

  # internal/services alone was 461 s of the race lane's 589 s (measured
  # 2026-08-15), and 75% of THAT sits in the 99 tests whose files hash
  # passwords: bcrypt is deliberately expensive and the race detector
  # multiplies that kind of code hardest — about four times harder than the
  # rest of the package. No race can live in those tests (they spawn no
  # goroutines), so they were paying the lane's largest bill for a check that
  # finds nothing in them.
  #
  # Go has no test sharding below package granularity, so the split is a `-run`
  # regexp — and the names come from `go test -list`, never from a hand-written
  # pattern. A pattern keyed on a SPELLING would leave a new test matching no
  # shard at all, running NOWHERE while every shard reported success. See
  # scripts/racepartition, whose tests pin exhaustiveness and disjointness
  # against a synthesised listing.
  race-services:
    runs-on: ubuntu-latest
    needs:
      - changes
    # Same fail-safe gate as test-go above.
    if: ${{ !cancelled() && needs.changes.outputs.run_race != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test with race detector — internal/services shard
        # The listing is taken WITHOUT -race: the names are the same and the
        # instrumented build is the expensive half. The divisor comes from
        # `strategy.job-total`, computed from the matrix above, so adding a
        # shard cannot leave a second literal behind.
        #
        # `set -o pipefail` matters here: without it the exit status would come
        # from `racepartition` and a failing listing would read as a pass.
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test -list '.*' ./internal/services/ > "$RUNNER_TEMP/tests.txt"
          run_pattern="$(go run ./scripts/racepartition -shard=${{ matrix.shard }} -of=${{ strategy.job-total }} < "$RUNNER_TEMP/tests.txt")"
          echo "shard ${{ matrix.shard }}/${{ strategy.job-total }} selects $(grep -cE '^(Test|Example|Fuzz)' "$RUNNER_TEMP/tests.txt") listed tests split by racepartition"
          go test -race -timeout 20m -run "$run_pattern" ./internal/services/

  race-rest:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ !cancelled() && needs.changes.outputs.run_race != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test with race detector
        # CGO is required for the race detector; the production image stays
        # CGO_ENABLED=0. Scope to packages that hold ovumcy's own shared mutable
        # state (rate-limiter maps, atomic CAS) and do NOT instantiate Fiber apps.
        # internal/api spins up hundreds of Fiber apps across its tests, which trips
        # a known fasthttp/fiber library-internal race (updateServerDate global and
        # the memory-store GC goroutine) that never occurs with the single app
        # instance in production — racing it only produces library noise, not ovumcy
        # bugs. The concurrency that is ours lives in the packages below.
        #
        # internal/services is NOT here: it is sharded in race-services above.
        # These four trees ran 100 s of the lane's 589 s together, so they stay
        # whole — splitting them would buy nothing and cost a job.
        env:
          CGO_ENABLED: "1"
        # `-timeout 20m`: the declared budget from the coverage step in test-go.
        # The race detector is strictly slower per test, so an undeclared
        # 10-minute default is armed harder here than where it was measured.
        run: go test -race -timeout 20m ./internal/db/... ./internal/security/... ./internal/i18n/... ./internal/httpx/...

      - name: Go test with race detector — cross-owner isolation
        # The exclusion above is by package, not by property, and the property
        # this test carries — two owners served concurrently through one app —
        # is the one place where instrumentation is worth the compile. It runs
        # a SINGLE Fiber app, so the library-internal race that rules the rest
        # of internal/api out never arms; keep it a named test, never a widening
        # back to the package.
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 20m -count=1 -run TestOwnerIsolationHoldsUnderConcurrentCrossOwnerRequests ./internal/api/

  # Thin gate job named exactly `race` — branch protection's required status
  # check is pinned to that literal name, which a matrix job cannot provide
  # (its contexts are `race-services (1)`, ...). Same shape and same reasoning
  # as the `test` and `e2e` gates: WITHOUT AN `if`, A FAILED DEPENDENCY SKIPS
  # THIS JOB, and a skipped required check counts as satisfied — which would
  # report a green `race` on a run where every shard failed.
  race:
    runs-on: ubuntu-latest
    needs:
      - race-services
      - race-rest
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Judge the race lanes
        env:
          SERVICES_RESULT: ${{ needs.race-services.result }}
          REST_RESULT: ${{ needs.race-rest.result }}
        run: |
          set -euo pipefail
          echo "race-services=$SERVICES_RESULT race-rest=$REST_RESULT"
          # `skipped` is a PASS here and only here, for the same reason as in
          # the other two gates: the `changes` job cleared `run_core`, which is
          # a decision not to run rather than a failure to run.
          for result in "$SERVICES_RESULT" "$REST_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a race lane reported \"$result\""; exit 1 ;;
            esac
          done
          echo "every race lane passed."

  coverage-upload:
    # Codecov's record of `main` is written from the MERGE-QUEUE run, not from
    # the `push` that follows it. It always was — the queue run reaches Codecov
    # first — and measurement says Codecov files it correctly: across 420
    # branches it knows for this repository there is not one
    # `gh-readonly-queue/*` entry, and commit 97f641e2… carries `branch: main`
    # (api.codecov.io/api/v2/github/ovumcy/repos/ovumcy-web, queried
    # 2026-08-18). The push run only ever added a second session for the same
    # numbers. It no longer runs at all: this job cascades to skipped off
    # test-go, which `run_core` clears on push.
    runs-on: ubuntu-latest
    needs:
      - test-go
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out
          path: .

      - name: Upload coverage to Codecov
        id: codecov
        # Tolerate a Codecov ingest failure everywhere except a pull request.
        # The gate that actually protects coverage is the local patch-coverage
        # job below; Codecov's own statuses are informational and no `codecov/*`
        # check is required on main. `merge_group` joined this list when the
        # authoritative upload moved here: an external ingest flake must not
        # colour the run that the README badge now reads, and it never had the
        # standing to, since the same flake was forgiven one event later. The
        # `push` arm stays for the fail-safe path — a `changes` job that dies
        # leaves `run_core` empty and this job runs on push after all — and
        # `workflow_dispatch` so that re-running a green run by hand cannot fail
        # on a flake the other events forgive.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: true
          # Install the CLI from PyPI instead of cli.codecov.io. The binary path
          # imports Codecov's signing key only from keybase.io, which the Actions
          # runners cannot reach reliably ("no valid OpenPGP data found" ->
          # signature check aborts before upload). PyPI install keeps integrity
          # (pip over TLS, package hashes) without the keybase dependency.
          use_pypi: true

      - name: Warn on non-blocking Codecov failure
        if: ${{ github.event_name != 'pull_request' && steps.codecov.outcome == 'failure' }}
        run: echo "::warning::Codecov upload failed on ${{ github.event_name }}. Coverage artifact was generated successfully, but Codecov ingest returned an external error."

  patch-coverage:
    runs-on: ubuntu-latest
    needs:
      - test-go
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out
          path: .

      - name: Fetch base branch
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Enforce patch coverage
        # Fails when a modified, coverable Go line is not covered by tests. This
        # is the in-CI, self-contained replacement for the external codecov patch
        # status, which can stall and deadlock a required check. See
        # scripts/patchcov for the gate logic (test files and tooling excluded).
        env:
          COVERAGE_FILE: coverage.out
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: go run ./scripts/patchcov

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
      # "Run the core suite" — the unit halves, both race lanes and the browser
      # shards: every lane whose evidence the merge queue has already produced
      # for this exact tree. It is `run_e2e` minus the work the queue did, so it
      # clears on a docs-only diff AND on a `push` to `main`; `run_e2e` above
      # stays true on push, because e2e-cross-browser, image-smoke and the
      # Postgres smoke are exactly the lanes the queue does NOT run.
      #
      # Unlike e2e's historical step-level gating below, the unit and race jobs
      # skip at the job level: GitHub reports a skipped job as a satisfied
      # required check (proven in practice on the sibling sync-community/managed
      # repos, whose whole Go battery merges this way).
      run_core: ${{ steps.detect.outputs.run_core }}
      # Two narrower slices of `run_core`, each with its own ground. They are
      # separate outputs rather than one, because what makes a change
      # irrelevant to the race detector has nothing to do with what makes it
      # irrelevant to the Go suite, and folding them would hide that.
      #
      # `run_race` — the race lanes. The detector instruments COMPILED Go, so a
      # change carrying no `.go`, no `go.mod` and no `go.sum` cannot introduce a
      # data race: the binaries are identical and the same tests still run
      # unraced in test-go. Locales, templates and web assets are go:embed'ed
      # DATA — changing them changes what the binary contains, never how it
      # synchronises. `.github/**` is carved back IN even though it compiles
      # nothing: a pull request editing the race job itself must not be judged
      # irrelevant by the job it is editing.
      run_race: ${{ steps.detect.outputs.run_race }}
      # `run_unit` — test-go. A Playwright spec is neither compiled into the Go
      # binary nor go:embed'ed, so an `e2e/**`-only change cannot alter a Go
      # test, a lint finding or a coverage line. test-FRONTEND deliberately
      # keeps gating on `run_core` instead: its `lint:types` step type-checks
      # the e2e suite, so it is the one job such a change must run.
      run_unit: ${{ steps.detect.outputs.run_unit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect whether browser e2e is needed
        id: detect
        # Fail-safe default is to RUN the browser e2e jobs. The Playwright suite
        # exercises the real Go app end-to-end, so backend, template, asset,
        # locale, dependency, Docker, and CI changes can all affect it. We only
        # skip when a change touches *nothing but* docs/meta files, or
        # .clusterfuzzlite/ (a separate ClusterFuzzLite build sandbox that is
        # never compiled into the app binary or go:embed'd — see
        # .clusterfuzzlite/Dockerfile), that cannot change the running app. Any
        # path outside the allowlist runs e2e.
        #
        # Two events carry a base the diff can stand on: a pull request (its
        # own base branch) and a merge-queue validation run
        # (merge_group.base_sha — the queue branch is that base plus every pull
        # request batched into the group, so one diff judges the whole batch).
        # A merge-queue run is judged by the same allowlist as the pull request
        # that produced it; until it was, a change already judged irrelevant on
        # its own run still paid the full battery in the queue, `race` included
        # — the lane the queue's 60-minute status-check timeout is measured
        # against. Push (main), release and workflow_dispatch still run in
        # full, so the post-merge safety net stays complete.
        #
        # Undetermined always means RUN — unknown event, missing or unreachable
        # base, a failed diff, an empty file list. Each fail-safe exit is
        # written as its own branch rather than left to a default, and the
        # consumers below repeat it once more (`!= 'false'`, evaluated even
        # when this job dies), so a crash here cannot skip them.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # Deliberately no `set -e`: this job must never fail, because the
          # required e2e jobs depend on it and a failed dependency would leave
          # their required checks unsatisfied. Every branch falls through to
          # the single verdict write at the end, and `run_e2e` starts at true
          # so only a positive docs-only determination clears it.
          run_e2e=true
          verdict=""

          case "$EVENT_NAME" in
            pull_request)
              if git fetch --no-tags origin "$BASE_REF"; then
                base="origin/$BASE_REF"
              else
                base=""
                verdict="base ref fetch failed: running e2e and the battery."
              fi
              ;;
            merge_group)
              # HEAD is the queue branch carrying the batched commits; the base
              # is the main commit the queue branched from. Full history is
              # checked out above, so this is normally already present.
              base="$QUEUE_BASE_SHA"
              if [ -z "$base" ]; then
                verdict="no base commit in the merge_group payload: running e2e and the battery."
              elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "merge_group base commit $base absent after checkout: fetching it"
                git fetch --no-tags origin "$base" || true
                if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                  base=""
                  verdict="merge_group base commit unreachable: running e2e and the battery."
                fi
              fi
              ;;
            *)
              base=""
              verdict="$EVENT_NAME carries no base to diff against: nothing is judged irrelevant here."
              ;;
          esac

          if [ -n "$base" ]; then
            if ! files="$(git diff --name-only "${base}...HEAD")"; then
              verdict="git diff ${base}...HEAD failed: running e2e and the battery."
            elif [ -z "$files" ]; then
              verdict="empty file list from ${base}...HEAD: running e2e and the battery."
            else
              echo "Changed files against ${base}:"
              printf '%s\n' "$files"
              # Anything NOT matching this docs/meta allowlist forces e2e to run.
              app_changes="$(printf '%s\n' "$files" | grep -vE '^(docs/|\.clusterfuzzlite/|LICENSE$|\.gitignore$|\.gitattributes$|.*\.md$)' || true)"
              if [ -z "$app_changes" ]; then
                run_e2e=false
                verdict="docs/meta-only change: the browser e2e jobs and the unit/race battery report success without running."
              else
                verdict="app-affecting change detected: running e2e and the battery."
              fi
            fi
          fi

          echo "$verdict"

          # `run_core` starts from the same allowlist verdict — diverge here,
          # never in a consumer, if the two ever need different file sets — and
          # then drops the work the merge queue has already done.
          #
          # A `push` to `main` can only be a merge the queue built: the «Protect
          # main» rule requires a pull request and the queue, and its bypass
          # list is empty, so no other write reaches this branch. On this rebase
          # queue the merge_group run's headSha is byte for byte the commit that
          # becomes `main` — measured 2026-08-18, 97f641e2… identical in run
          # 32081210308 and at the head of `main` — so the unit, frontend, race
          # and browser-shard lanes here would re-test a tree proven minutes
          # earlier. What the queue does NOT run stays: e2e-cross-browser and
          # image-smoke gate themselves on the event, and e2e-postgres-smoke's
          # own RUN_HEAVY keeps its work off pull requests and off the queue, so
          # `push` is the only place it ever executes.
          #
          # Fail-safe in the same direction as everything above: the clear is
          # written only inside the `push` branch, so an unknown event, a
          # crashed job or an empty output all leave the core suite RUNNING.
          run_core="$run_e2e"
          if [ "$EVENT_NAME" = "push" ]; then
            run_core=false
            echo "push to main: the merge queue already ran the core suite on this exact commit; running only the lanes it skips."
          fi

          # The two narrower slices. Both start from `run_core`, so everything
          # it already cleared stays cleared, and both are only ever narrowed
          # inside a branch that has a real file list — an unknown event, a
          # crashed diff or an empty listing leaves them exactly as `run_core`
          # left them, which is the running direction.
          run_race="$run_core"
          run_unit="$run_core"
          if [ -n "${files:-}" ]; then
            # Anything that can change the compiled program, plus the workflow
            # directory: a pull request that edits the race job must still run
            # it. Measured 2026-08-18 over the last 59 merged pull requests:
            # 22 carried no compiled Go, and 8 of those were `.github/**`, so
            # this carve-out costs a third of the slice and is not optional.
            compiled="$(printf '%s\n' "$files" | grep -E '(\.go$|^go\.mod$|^go\.sum$|^\.github/)' || true)"
            if [ -z "$compiled" ]; then
              run_race=false
              echo "no compiled Go and no workflow change: the race lanes report success without running."
            fi
            # Browser-spec-only: the e2e allowlist plus the docs/meta one.
            beyond_specs="$(printf '%s\n' "$files" | grep -vE '^(e2e/|docs/|\.clusterfuzzlite/|LICENSE$|\.gitignore$|\.gitattributes$|.*\.md$)' || true)"
            if [ -z "$beyond_specs" ]; then
              run_unit=false
              echo "browser specs only: the Go suite reports success without running."
            fi
          fi

          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"
          echo "run_core=$run_core" >> "$GITHUB_OUTPUT"
          echo "run_race=$run_race" >> "$GITHUB_OUTPUT"
          echo "run_unit=$run_unit" >> "$GITHUB_OUTPUT"

  # The browser suite runs here, split across shards, and the required status
  # check named `e2e` is the thin gate job below — the same shape branch
  # protection already forces on `test`, and for the same reason: a matrix job
  # reports one context per cell (`e2e-shard (1)`, ...), none of which is the
  # literal name the required check is pinned to.
  #
  # Sharding is NOT raising parallelism inside one database, which
  # `.claude/rules/e2e.md` rules out for the SQLite-backed stateful flows.
  # Every shard is its own runner: its own `go run` app, its own SQLite file
  # under .tmp/e2e, and still `--workers=1` from the runner (`--mode=ci`). What
  # changes is how many app instances exist, not how many tests share one.
  # This is only safe because every spec provisions its own owner —
  # `createCredentials` mints a unique address per call — so no spec depends on
  # state another spec file left behind.
  #
  # Measured 2026-08-15: 200 tests over 33 spec files, 793 s in one lane; three
  # shards split them 76/60/64. The shard count is NOT repeated in the
  # `--shard=` argument — `strategy.job-total` reads it off the matrix itself,
  # so adding a shard is a one-line edit that cannot leave the divisor behind.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    needs:
      - changes
    strategy:
      # One shard's failure must not cancel its siblings: the point of the
      # split is to learn everything the browser lane knows in one run.
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    # Historical note:
    # this job gates each work STEP instead of using a job-level `if` because
    # job-level skips were believed to leave the required check unsatisfied —
    # that is not how GitHub behaves today (a skipped job reports as a
    # satisfied required check; the unit/race battery above and the sibling
    # repos rely on it). The step-gated shape is kept as-is, and it is now the
    # thing that does the work: this job used to cascade to skipped on a
    # docs-only change because its `test` dependency skipped first, but `test`
    # judges its halves rather than disappearing, so on a docs-only pull request
    # — or merge-queue run — it reports success and this job RUNS with every
    # step gated off. The RUN_E2E guards are therefore load-bearing on the
    # ordinary path, not only if the two allowlists in `changes` ever diverge.
    # Those guards carry the battery's fail-safe form
    # (`!= 'false'`): an absent output must not silently green a job that ran.
    #
    # NOT `needs: test`. That edge was the whole critical path: measured
    # 2026-08-15 on run 31849738519, `test-go` ran 7 min 23 s and this job did
    # not start until it finished, so a 13 min 48 s browser suite reported at
    # 21 min 27 s. Nothing here consumes an artifact or an output of the unit
    # battery — the edge only expressed "don't burn browser minutes until the
    # cheap suites pass", which on a public repository buys nothing and costs
    # every green run those 7 minutes twice over (pull_request, then again in
    # merge_group).
    #
    # Dropping it also closes a hole rather than opening one. A failed
    # dependency SKIPS a job, and a skipped required check counts as SATISFIED
    # (measured 2026-08-08) — so while this edge existed, a failing `test-go`
    # left `e2e` skipped, i.e. green, and the browser suite never judged that
    # commit at all. Now it runs on its own evidence and reports its own
    # verdict.
    env:
      RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
      # The browser lane no longer runs on `push` at all. It used to run a
      # three-spec smoke there, whole on shard 1 with the other two standing
      # down; the merge queue now runs the FULL sharded suite on the identical
      # commit (see `run_core` in the `changes` job), so the smoke re-proved a
      # strict subset of what had already passed. Cross-browser coverage, which
      # the queue genuinely does not run, is e2e-cross-browser's job and gates
      # itself on the event.
      #
      # Written in the fail-safe direction (`!= 'false'` at every use) like
      # RUN_E2E: an expression that ever evaluates empty must leave the work
      # running, never silently drop it.
      RUN_SHARDS: ${{ needs.changes.outputs.run_core }}

    steps:
      - name: Checkout
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and e2e dependencies
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        run: npm ci

      - name: Cache Playwright browsers
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
        # NO `--with-deps`: this downloads the browser binary and touches apt not
        # at all. This lane is CHROMIUM-ONLY, which is what makes that safe — see
        # the paragraph at the end. The apt half used to live here and in a second
        # step below, and
        # it was the single least reliable thing in CI — three hangs in 24 hours
        # on an unresponsive Azure mirror (runs 32070919012, 32085785273 and,
        # after the timeout bound landed, 32090266798 failing honestly at 905 s).
        #
        # What it was buying, read off the install log of run 32081716803:
        # `0 upgraded, 9 newly installed, 0 to remove and 12 not upgraded`. Every
        # real Playwright dependency is already on the ubuntu-latest image; the
        # nine were all FONTS — fonts-ipafont-gothic (Japanese), fonts-wqy-zenhei
        # (Chinese), fonts-tlwg-loma-otf (Thai), fonts-unifont, fonts-freefont-ttf
        # and the xfonts-* set. This application ships six locales — de en es fr
        # it ru — so no CJK or Thai text exists to render, no spec contains a CJK
        # or Thai character, and Cyrillic is served by DejaVu, which the image
        # already carries.
        #
        # Playwright asserts the DOM, not pixels: a missing glyph cannot fail
        # `toHaveText`, and the suite makes no screenshot comparison at all
        # (`toHaveScreenshot`/`toMatchSnapshot`: zero occurrences). It does make
        # geometry assertions, which is the one way a font could matter — so this
        # is a change the browser suite itself judges, and its verdict on this
        # pull request is the evidence for it.
        #
        # SCOPE: this removal is correct for the chromium-only lanes and WRONG for
        # e2e-cross-browser, which therefore keeps its apt steps. The delta apt
        # actually computes differs by an order of magnitude — measured on push run
        # 32081716803, same commit, same image: `9 newly installed` here and in
        # e2e-postgres-smoke, against `181 newly installed` in the cross-browser
        # lane, of which 165 are real libraries (gstreamer1.0-*, libav*, libcairo-*
        # — WebKit's media stack), not fonts. Evidence gathered on a chromium lane
        # does not carry to a lane that also builds Firefox and WebKit, and the
        # pull-request run cannot catch the difference: e2e-cross-browser runs only
        # on push, release and workflow_dispatch, so it would have broken on `main`.
        #
        # If Chromium ever fails to LAUNCH rather than to render, look here first:
        # the claim above rests on one image's package list, and a future runner
        # image could drop a dependency this no longer installs.
        run: timeout 600 npx playwright install chromium

      - name: Run Playwright e2e
        # The divisor comes from `strategy.job-total`, which GitHub computes
        # from the matrix above — never a second literal to keep in step with
        # it. `--shard` splits by spec file, and each shard gets its own app
        # and database, so the runner's own `--workers=1` still holds inside
        # one shard.
        if: env.RUN_E2E != 'false' && env.RUN_SHARDS != 'false'
        run: npm run e2e:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_APP_PORT: 18080

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
            .tmp/e2e
          if-no-files-found: ignore

  # Thin gate job named exactly `e2e` — branch protection's required status
  # check is pinned to that literal context name, and a matrix job cannot
  # provide it (its contexts are `e2e-shard (1)`, `e2e-shard (2)`, ...).
  # Identical in shape and in reasoning to the `test` gate above: WITHOUT AN
  # `if`, A FAILED DEPENDENCY SKIPS THIS JOB, and a skipped required check
  # counts as satisfied — which would hand the merge a green `e2e` on a run
  # where every shard failed.
  #
  # `needs.e2e-shard.result` is the aggregate over the whole matrix: `success`
  # only when every shard succeeded, `failure` when any of them failed. With
  # `fail-fast: false` above, all shards have reported by the time this runs.
  e2e:
    runs-on: ubuntu-latest
    needs:
      - e2e-shard
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Judge the browser shards
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          echo "e2e-shard=$SHARDS_RESULT"
          # `skipped` is a PASS here and only here, for the same reason it is in
          # the `test` gate: the `changes` job cleared `run_core`, which is a
          # decision not to run rather than a failure to run. Anything else
          # — failure, cancelled, or a state this gate has never seen — is this
          # context's failure.
          case "$SHARDS_RESULT" in
            success|skipped) ;;
            *) echo "::error::the browser shards reported \"$SHARDS_RESULT\""; exit 1 ;;
          esac
          echo "every browser shard passed."

  e2e-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    needs:
      - changes
    # Required status check with admin enforcement: always run the job and gate
    # the work per step (see the `e2e` job above) so docs-only PRs stay green
    # without leaving this required check unsatisfied. The Postgres/multi-locale
    # coverage this job adds over the plain `e2e` job is also only needed on
    # push/release/dispatch, not on every PR, so RUN_HEAVY gates it further.
    #
    # RUN_HEAVY excludes `merge_group` too, which makes this the ONE core-looking
    # lane that `push` must keep: measured 2026-08-18, the job took 3 s in queue
    # run 32081210308 (every step gated off) and 240 s in push run 32081716803
    # doing the real work. Reading it as a third repeat of the browser suite and
    # trimming it would delete the only Postgres evidence this repository has.
    env:
      RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
      RUN_HEAVY: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and e2e dependencies
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        # NO `--with-deps`: this downloads the browser binary and touches apt not
        # at all. This lane is CHROMIUM-ONLY, which is what makes that safe — see
        # the paragraph at the end. The apt half used to live here and in a second
        # step below, and
        # it was the single least reliable thing in CI — three hangs in 24 hours
        # on an unresponsive Azure mirror (runs 32070919012, 32085785273 and,
        # after the timeout bound landed, 32090266798 failing honestly at 905 s).
        #
        # What it was buying, read off the install log of run 32081716803:
        # `0 upgraded, 9 newly installed, 0 to remove and 12 not upgraded`. Every
        # real Playwright dependency is already on the ubuntu-latest image; the
        # nine were all FONTS — fonts-ipafont-gothic (Japanese), fonts-wqy-zenhei
        # (Chinese), fonts-tlwg-loma-otf (Thai), fonts-unifont, fonts-freefont-ttf
        # and the xfonts-* set. This application ships six locales — de en es fr
        # it ru — so no CJK or Thai text exists to render, no spec contains a CJK
        # or Thai character, and Cyrillic is served by DejaVu, which the image
        # already carries.
        #
        # Playwright asserts the DOM, not pixels: a missing glyph cannot fail
        # `toHaveText`, and the suite makes no screenshot comparison at all
        # (`toHaveScreenshot`/`toMatchSnapshot`: zero occurrences). It does make
        # geometry assertions, which is the one way a font could matter — so this
        # is a change the browser suite itself judges, and its verdict on this
        # pull request is the evidence for it.
        #
        # SCOPE: this removal is correct for the chromium-only lanes and WRONG for
        # e2e-cross-browser, which therefore keeps its apt steps. The delta apt
        # actually computes differs by an order of magnitude — measured on push run
        # 32081716803, same commit, same image: `9 newly installed` here and in
        # e2e-postgres-smoke, against `181 newly installed` in the cross-browser
        # lane, of which 165 are real libraries (gstreamer1.0-*, libav*, libcairo-*
        # — WebKit's media stack), not fonts. Evidence gathered on a chromium lane
        # does not carry to a lane that also builds Firefox and WebKit, and the
        # pull-request run cannot catch the difference: e2e-cross-browser runs only
        # on push, release and workflow_dispatch, so it would have broken on `main`.
        #
        # If Chromium ever fails to LAUNCH rather than to render, look here first:
        # the claim above rests on one image's package list, and a future runner
        # image could drop a dependency this no longer installs.
        run: timeout 600 npx playwright install chromium

      - name: Run Playwright Postgres smoke
        if: env.RUN_E2E != 'false' && env.RUN_HEAVY == 'true'
        run: npm run e2e:ci:postgres -- e2e/auth-login-register.spec.ts e2e/dashboard.spec.ts e2e/theme-dark-mode.spec.ts
        env:
          E2E_APP_PORT: 18081

      - name: Upload Playwright Postgres artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-postgres-artifacts
          path: |
            playwright-report
            test-results
            .tmp/e2e
          if-no-files-found: ignore

  e2e-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs:
      - changes
    # Not a required status check, so cross-browser coverage beyond the plain
    # `e2e` job's Chromium run is deferred to push/release/dispatch. The
    # relevance half carries the battery's fail-safe form (`!= 'false'`): a
    # `changes` job that died must not silently drop post-merge coverage.
    if: ${{ !cancelled() && needs.changes.outputs.run_e2e != 'false' && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and e2e dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cross-browser-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # `playwright install --with-deps` is an apt front end, and apt hangs on an
        # unresponsive mirror rather than failing. Unbounded, that hang runs until
        # the JOB timeout — 45 minutes — and GitHub reports a timed-out job as
        # `cancelled`, not `failed`, so a required check goes red with no failed
        # step to look at. It happened twice inside 24 hours: run 32070919012 on
        # 2026-08-17 (45 min, took the README badge red) and run 32085785273 on
        # 2026-08-18, both on this same step.
        #
        # Bounded, and NOT retried. Both halves are measured, and the first
        # attempt at this fix got both of them wrong (run 32087754303):
        #
        #   - the bound cannot be tight. The 11-50 s this step usually takes is
        #     the path where the packages are already present; a cold run pulls
        #     21.1 MB from the Azure mirror and legitimately ran past 300 s. The
        #     bound exists to beat the 45-minute job timeout, nothing finer.
        #   - a retry cannot work. `timeout` kills apt mid-transaction and the
        #     orphan keeps /var/lib/dpkg/lock-frontend, so the next attempt dies
        #     at once on `Could not get lock` — observed, exit 100. A bounded
        #     single attempt fails honestly; a retry only fails twice.
        run: timeout 1500 npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # `playwright install-deps` is an apt front end, and apt hangs on an
        # unresponsive mirror rather than failing. Unbounded, that hang runs until
        # the JOB timeout — 45 minutes — and GitHub reports a timed-out job as
        # `cancelled`, not `failed`, so a required check goes red with no failed
        # step to look at. It happened twice inside 24 hours: run 32070919012 on
        # 2026-08-17 (45 min, took the README badge red) and run 32085785273 on
        # 2026-08-18, both on this same step.
        #
        # Bounded, and NOT retried. Both halves are measured, and the first
        # attempt at this fix got both of them wrong (run 32087754303):
        #
        #   - the bound cannot be tight. The 11-50 s this step usually takes is
        #     the path where the packages are already present; a cold run pulls
        #     21.1 MB from the Azure mirror and legitimately ran past 300 s. The
        #     bound exists to beat the 45-minute job timeout, nothing finer.
        #   - a retry cannot work. `timeout` kills apt mid-transaction and the
        #     orphan keeps /var/lib/dpkg/lock-frontend, so the next attempt dies
        #     at once on `Could not get lock` — observed, exit 100. A bounded
        #     single attempt fails honestly; a retry only fails twice.
        run: timeout 1200 npx playwright install-deps chromium firefox webkit

      - name: Run Playwright cross-browser smoke
        run: npm run e2e:cross-browser
        env:
          E2E_APP_PORT: 18082

      - name: Upload Playwright cross-browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-cross-browser-artifacts
          path: |
            playwright-report
            test-results
            .tmp/e2e
          if-no-files-found: ignore

  image-smoke:
    # Boots the actual FROM-scratch runtime image and hits its public surfaces.
    # The unit/e2e jobs exercise the app under `go run`; only this job proves the
    # embedded templates/locales/web-static (go:embed) and the static.New asset
    # middleware serve correctly from the shell-less scratch image, and that the
    # in-container `ovumcy healthcheck`/`readycheck` self-probes pass. Not a required status
    # check and the image isn't built on PRs at all, so this runs on
    # push/release/dispatch, catching an asset/embed/packaging regression
    # before it reaches a release tag.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - changes
    # Same fail-safe relevance form as the battery above.
    if: ${{ !cancelled() && needs.changes.outputs.run_e2e != 'false' && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build runtime image
        # GHA-cached build (shared with the trivy-image build in security.yml
        # for the same ref) so this doesn't rebuild every layer from scratch
        # despite `trivy-image` staying a separate required check.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ovumcy-image-smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot image and smoke public surfaces
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          cid="$(docker run -d --rm -p 18080:8080 -e SECRET_KEY="$secret" ovumcy-image-smoke:${{ github.sha }})"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          # The scratch image has no shell/curl, so probe readiness from the host.
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "app did not become healthy"; docker logs "$cid" || true; exit 1; fi

          curl -fsS http://localhost:18080/healthz | grep -q '"status":"ok"'

          # /readyz additionally proves the storage layer answers inside the
          # image: it runs a real query against the container's own database,
          # which no other assertion here reaches.
          curl -fsS http://localhost:18080/readyz | grep -q '"status":"ok"'

          # /login renders from embedded templates.
          login="$(curl -fsS http://localhost:18080/login)"
          printf '%s' "$login" | grep -q 'id="login-form"'

          # A versioned /static asset serves via static.New from the embedded FS
          # with the release cache header.
          asset="$(printf '%s' "$login" | grep -oE '/static/[^"?]+\?v=[A-Za-z0-9]+' | head -1)"
          if [ -z "$asset" ]; then echo "no versioned static asset found in /login"; exit 1; fi
          curl -fsS -D - -o /dev/null "http://localhost:18080$asset" \
            | tr -d '\r' | grep -iq '^cache-control: public, max-age=3600'

          # The container's own HEALTHCHECK command (the binary self-probe) and
          # its readiness sibling, which an operator runs by hand on a shell-free
          # image. The HEALTHCHECK directive deliberately stays on the liveness
          # probe so a storage blip cannot restart the container.
          docker exec "$cid" /app/ovumcy healthcheck
          docker exec "$cid" /app/ovumcy readycheck

          echo "image smoke OK: healthz + readyz + login + static ($asset) + in-container healthcheck/readycheck"

  publish-image:
    # Publishes `ghcr.io/<repo>:latest` (plus `main` and `sha-<short>`) for the
    # commit now on `main`. The publish used to be its own push-triggered
    # workflow, which put it in a race with the very checks meant to judge that
    # commit — and it won: `:latest` was anonymously pullable before `test`,
    # `e2e`, `image-smoke` or the Trivy scans had reported. Branch protection
    # guards the merge, not the commit the merge produces, so nothing else
    # covered this.
    #
    # `needs:` cannot cross workflow boundaries, so the gate has to live here,
    # in the workflow that owns those jobs, and the publish is reached by
    # calling the workflow that already publishes release tags. The scans in
    # security.yml still cannot be depended on from here; the called workflow
    # scans the exact image it is about to push instead, with the same gate as
    # the required `trivy-image` check.
    #
    # `:latest` therefore now trails a push to `main` by a full CI run instead
    # of appearing within a couple of minutes, and stays on the previous commit
    # when any of these jobs fails. That is the intended trade.
    needs:
      - test
      - race
      - e2e
      - e2e-postgres-smoke
      - image-smoke
    # Never on a pull request, and never for the `release: published` event —
    # release tags publish from their own tag push, through the same workflow.
    # `workflow_dispatch` on `main` is kept as the manual re-publish path, gated
    # the same way, since the Docker Image workflow no longer accepts one.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # A caller cannot grant a called workflow more than it holds, so this must
    # match the permissions the publish job declares.
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-image.yml
    # Passed explicitly rather than with `secrets: inherit`: the publish job
    # needs exactly these two, for authenticated base-image pulls.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
