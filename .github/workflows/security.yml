name: Security

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_IMAGE: aquasec/trivy:0.68.2@sha256:05d0126976bdedcd0782a0336f77832dbea1c81b9cc5e4b3a5ea5d2ec863aca7
  # Pinned once here — the binary cache key below is built from the same
  # values, so a spelling repeated as a literal in the key would silently
  # drift from the install line (see "Cache Go tool binaries" in ci.yml).
  # git SHA for v2.29.0: deb54465fea23d19a77f037e11e6589021f8501d (verified via go list -m -json)
  GOSEC_VERSION: v2.29.0
  # git SHA for v1.3.0: 0782b76014f15f24e22a438f30f308df42899ba1 (verified via go list -m -json)
  GOVULNCHECK_VERSION: v1.3.0

on:
  push:
    branches:
      - main
  pull_request:
  # Merge-queue validation runs: every workflow that owns a required status
  # check must also report on merge_group, or a queued merge waits forever.
  merge_group:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR, so a rapid
# string of fixup pushes doesn't queue every intermediate run to completion.
# Only cancels pull_request runs — push (main), the weekly schedule, and
# workflow_dispatch always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GOBIN: ${{ github.workspace }}/.bin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Caches the tool BINARY, not golangci-lint's forbidden analysis cache
      # (see ci.yml's "Cache Go tool binaries" for why that distinction
      # matters): a compiled binary is a pure function of its pinned version
      # and the toolchain that built it, and the key names both in full.
      # No `restore-keys` — a prefix match would serve a binary of a
      # different pinned version, which is exactly what the full key exists
      # to prevent.
      - name: Cache gosec binary
        id: gosec-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: ${{ runner.os }}-gotools-go${{ steps.setup-go.outputs.go-version }}-gosec${{ env.GOSEC_VERSION }}

      - name: Verify the restored binary is the pinned version
        # go version -m reads the embedded module version regardless of
        # build-time ldflags, unlike `gosec --version` which prints "dev" for
        # a plain `go install`.
        if: steps.gosec-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed="$(go version -m "$GOBIN/gosec" | awk '$1=="mod" && $2=="github.com/securego/gosec/v2" {print $3}')"
          if [ "$installed" != "$GOSEC_VERSION" ]; then
            echo "::error::cached gosec is ${installed:-<none>}, expected $GOSEC_VERSION"
            exit 1
          fi

      - name: Install gosec
        if: steps.gosec-cache.outputs.cache-hit != 'true'
        run: go install "github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION"

      - name: Prepare security artifact directory
        run: mkdir -p .tmp/security

      - name: Run gosec
        run: ./.bin/gosec -fmt sarif -out .tmp/security/gosec.sarif ./cmd/... ./internal/...

      - name: Upload gosec SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: .tmp/security/gosec.sarif
          category: gosec

      - name: Upload gosec artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-results
          path: .tmp/security/gosec.sarif
          if-no-files-found: error

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOBIN: ${{ github.workspace }}/.bin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # See the gosec job's "Cache gosec binary" step for why caching a
      # compiled tool binary is not the forbidden analysis cache.
      - name: Cache govulncheck binary
        id: govulncheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: ${{ runner.os }}-gotools-go${{ steps.setup-go.outputs.go-version }}-govulncheck${{ env.GOVULNCHECK_VERSION }}

      - name: Verify the restored binary is the pinned version
        if: steps.govulncheck-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed="$(go version -m "$GOBIN/govulncheck" | awk '$1=="mod" && $2=="golang.org/x/vuln" {print $3}')"
          if [ "$installed" != "$GOVULNCHECK_VERSION" ]; then
            echo "::error::cached govulncheck is ${installed:-<none>}, expected $GOVULNCHECK_VERSION"
            exit 1
          fi

      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"

      - name: Run govulncheck
        # Call-graph reachability gate: govulncheck exits non-zero only when the
        # code actually calls a known-vulnerable symbol. Vulnerable-but-unreachable
        # packages are left to the Trivy package scan; surfacing them here as SARIF
        # only floods the Security tab with findings the code never reaches.
        run: ./.bin/govulncheck ./...

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Skipped on fork PRs where the secret is unavailable; authenticated pulls
        # on trusted runs avoid the anonymous Docker Hub rate limit.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare security artifact directory
        run: mkdir -p .tmp/security

      - name: Pull Trivy image
        uses: ./.github/actions/docker-pull-retry
        with:
          image: ${{ env.TRIVY_IMAGE }}

      - name: Run Trivy filesystem scan
        # No --ignore-unfixed: this SARIF is also what the Security tab shows
        # (upload step below), so a CRITICAL with no upstream fix yet must
        # stay visible in both the gate and the tab, not disappear from each.
        run: docker run --rm -v "${{ github.workspace }}:/work" -w /work "${{ env.TRIVY_IMAGE }}" fs --scanners vuln --skip-version-check --severity HIGH,CRITICAL --include-dev-deps --skip-dirs .tmp --skip-dirs web/static --format sarif --output .tmp/security/trivy-fs.sarif --exit-code 1 .

      - name: Upload Trivy filesystem SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: .tmp/security/trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy filesystem artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-fs-results
          path: .tmp/security/trivy-fs.sarif
          if-no-files-found: error

  trivy-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Skipped on fork PRs where the secret is unavailable; authenticated pulls
        # on trusted runs avoid the anonymous Docker Hub rate limit.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image for scanning
        # GHA-cached build (shared with the image-smoke build in ci.yml for the
        # same ref). `trivy-image` is a required status check, so it cannot be
        # merged into a shared build-once job without reconfiguring branch
        # protection required checks; this cache is the honest dedup available
        # without that change.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ovumcy-security:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare security artifact directory
        run: mkdir -p .tmp/security

      - name: Pull Trivy image
        # Covers the scan step immediately below (same cached image). The SBOM
        # step further down pulls again — see its own comment — because it must
        # still run even if this pull's retries are exhausted.
        uses: ./.github/actions/docker-pull-retry
        with:
          image: ${{ env.TRIVY_IMAGE }}

      - name: Run Trivy image scan
        # No --ignore-unfixed: same reason as trivy-fs above — this SARIF feeds
        # the Security tab, so an unfixed CRITICAL must stay visible there too.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/work" -w /work "${{ env.TRIVY_IMAGE }}" image --scanners vuln --skip-version-check --severity HIGH,CRITICAL --format sarif --output .tmp/security/trivy-image.sarif --exit-code 1 ovumcy-security:${{ github.sha }}

      - name: Pull Trivy image for SBOM
        # Generate CycloneDX SBOM below runs `if: always()` so it still executes
        # when the scan step above fails on findings (--exit-code 1) or when the
        # pull step above never completed (retries exhausted). The latter used to
        # fall straight through to `docker run`'s own single, un-retried implicit
        # pull, which is what let a Docker Hub timeout cascade into the SARIF and
        # artifact upload steps (run 30202113726). Repeating the retrying pull
        # here is a cache-hit no-op on the common path and a real retry on the
        # failure path.
        if: always()
        uses: ./.github/actions/docker-pull-retry
        with:
          image: ${{ env.TRIVY_IMAGE }}

      - name: Generate CycloneDX SBOM
        if: always()
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/work" -w /work "${{ env.TRIVY_IMAGE }}" image --skip-version-check --format cyclonedx --output .tmp/security/ovumcy-image.cdx.json ovumcy-security:${{ github.sha }}

      - name: Upload Trivy image SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: .tmp/security/trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy image artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-results
          path: |
            .tmp/security/trivy-image.sarif
            .tmp/security/ovumcy-image.cdx.json
          if-no-files-found: error
