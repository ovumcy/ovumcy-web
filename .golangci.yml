# golangci-lint v2 configuration (CI pins v2.12.2 in .github/workflows/ci.yml).
#
# Baseline: the standard default linters (errcheck, govet, ineffassign,
# staticcheck, unused) — exactly what CI ran before this file existed, so
# adding the file changes nothing about the checks the repo already passed.
#
# Additions are conservative, objective linters the tree is verifiably clean
# under (CI's zero-issue run enforces it stays that way) with no style churn
# or subjective rules:
#   - copyloopvar: flags loop-variable copies made redundant by Go 1.22
#     per-iteration loop variables; pure dead code under go 1.26.
#   - intrange: canonical Go 1.22 `for i := range n` counting loops instead
#     of the three-clause form.
#   - misspell: objective spelling fixes in comments and strings; locale left
#     at the default, matching the codebase's existing spelling.
#   - unconvert: removes type conversions that are no-ops; they only obscure
#     the actual types in security-relevant code.
#
# Evaluated against the codebase and deliberately NOT enabled:
#   - gocritic: its default set flags intentional test patterns here (mapKey
#     on a whitespace-trimming case, appendAssign on deliberate base-slice
#     reuse) and the guarded exit path in cmd/ovumcy (exitAfterDefer); making
#     it pass would need inline suppressions or disabling most of what fired.
#   - unparam: every finding is a signature change (always-nil error results,
#     constant test-helper parameters) — refactors to weigh case by case, not
#     mechanical hygiene.
#
# The repo carries zero //nolint directives; keep it that way. If a new
# finding is a false positive, prefer narrowing the linter's settings here
# (with a comment) over inline suppressions.
version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - intrange
    - misspell
    - unconvert
  exclusions:
    # `npm ci` installs at least one package that ships Go sources of its own
    # (`flatted`, a Go port beside its JavaScript), and a bare `golangci-lint
    # run` walks straight into it: five findings — 2 govet, 3 intrange — in a
    # file nothing here calls, that is untracked, and that the next install
    # overwrites. Scoping the run by hand hides them and hides nothing else,
    # but only for whoever remembers to; the config is where it belongs, so
    # the plain command is the correct command.
    paths:
      - node_modules
  settings:
    misspell:
      # Localized copy asserted by backend regressions is not English prose:
      # "successivo" is Italian for "next" (it.json month-navigation label),
      # which misspell's default locale reads as a misspelling of "succession".
      ignore-rules:
        - successivo
